name: Quality Gate CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 2.14.1-dev

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    uses: HYGON-AI/quality-gate/.github/workflows/pr-quality-gate.yml@stable
    permissions:
      contents: read
