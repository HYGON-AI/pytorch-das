name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 2.13.0-dev

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    uses: HYGON-AI/quality-gate/.github/workflows/pr-quality-gate.yml@64c47cdd3078dbdd53e5ea254706eecad7d8e38b # stable
    permissions:
      contents: read
