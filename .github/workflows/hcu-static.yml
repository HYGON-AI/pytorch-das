name: HCU CI Static

on:
  pull_request:
    paths:
      - .ci/pytorch/common_utils.sh
      - .github/actions/setup-hcu/**
      - .github/labeler.yml
      - .github/scripts/hcu_ci_manifest.py
      - .github/scripts/hcu_smoke_test.py
      - .github/scripts/test_hcu_ci_contract.py
      - .github/scripts/test_hcu_ci_manifest.py
      - .github/workflows/_hcu-*.yml
      - .github/workflows/hcu*.yml
      - .github/workflows/pull.yml
      - .lintrunner.toml
      - .spin/**
      - aten/src/ATen/CMakeLists.txt
  push:
    paths:
      - .ci/pytorch/common_utils.sh
      - .github/actions/setup-hcu/**
      - .github/labeler.yml
      - .github/scripts/hcu_ci_manifest.py
      - .github/scripts/hcu_smoke_test.py
      - .github/scripts/test_hcu_ci_contract.py
      - .github/scripts/test_hcu_ci_manifest.py
      - .github/workflows/_hcu-*.yml
      - .github/workflows/hcu*.yml
      - .github/workflows/pull.yml
      - .lintrunner.toml
      - .spin/**
      - aten/src/ATen/CMakeLists.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcu-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hcu-static:
    if: >-
      ${{
        github.repository == 'HYGON-AI/pytorch-das' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: [self-hosted, linux, x64, "${{ vars.HCU_CONTROL_RUNNER }}"]
    timeout-minutes: 20
    env:
      CI: "1"
      HCU_CI_IMAGE: ${{ vars.HCU_CI_IMAGE }}
      HCU_STATIC_CACHE_ROOT: /home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-cache/static
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          submodules: false

      - name: Run HCU static checks in the CI image
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${HCU_CI_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "HCU_CI_IMAGE must use an immutable sha256 digest" >&2
            exit 1
          fi
          command -v docker
          docker pull "${HCU_CI_IMAGE}"

          run_label="hcu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-static"
          container_name="pytorch-hcu-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="${RUNNER_TEMP}/${run_label}"
          expected_cache_root=/home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-cache/static
          cache_root="$(realpath -m -- "${HCU_STATIC_CACHE_ROOT}")"
          if [[ "${cache_root}" != "${expected_cache_root}" ]]; then
            echo "HCU static cache root must be ${expected_cache_root}" >&2
            exit 1
          fi
          mkdir -p "${run_dir}"
          install -d -m 0750 \
            "${cache_root}/bin" \
            "${cache_root}/pip-cache" \
            "${cache_root}/tools" \
            "${cache_root}/uv-cache" \
            "${cache_root}/xdg-data"

          docker run --detach \
            --name "${container_name}" \
            --label "org.pytorch.hcu.run=${run_label}" \
            --user "$(id -u):$(id -g)" \
            --env CI \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/var/lib/jenkins/workspace \
            --env PIP_CACHE_DIR=/static-cache/pip-cache \
            --env PYTHONUSERBASE=/runner-temp/python \
            --env UV_CACHE_DIR=/static-cache/uv-cache \
            --env UV_TOOL_BIN_DIR=/static-cache/bin \
            --env UV_TOOL_DIR=/static-cache/tools \
            --env XDG_DATA_HOME=/static-cache/xdg-data \
            --volume "${GITHUB_WORKSPACE}:/var/lib/jenkins/workspace" \
            --volume "${run_dir}:/runner-temp" \
            --volume "${cache_root}:/static-cache" \
            --workdir /var/lib/jenkins/workspace \
            "${HCU_CI_IMAGE}" \
            sleep infinity

          echo "HCU_STATIC_CONTAINER=${container_name}" >> "${GITHUB_ENV}"
          echo "HCU_STATIC_LABEL=org.pytorch.hcu.run=${run_label}" >> "${GITHUB_ENV}"
          docker exec "${container_name}" bash -lc '
            set -euo pipefail
            export PATH="${PYTHONUSERBASE}/bin:${PATH}"
            python3 -m pip install --user --disable-pip-version-check \
              packaging==24.0 \
              PyYAML==6.0.2 \
              spin==0.17 \
              typing-extensions==4.12.2 \
              uv==0.12.0
            python3 .github/scripts/test_hcu_ci_contract.py
            python3 .github/scripts/test_hcu_ci_manifest.py
            spin quicklint -- \
              --take ACTIONLINT,CMAKE,RUFF,SHELLCHECK \
              .ci/pytorch/common_utils.sh \
              .github/actions/setup-hcu/action.yml \
              .github/scripts/hcu_ci_manifest.py \
              .github/scripts/hcu_smoke_test.py \
              .github/scripts/test_hcu_ci_contract.py \
              .github/scripts/test_hcu_ci_manifest.py \
              .github/workflows/_hcu-build.yml \
              .github/workflows/_hcu-preflight.yml \
              .github/workflows/_hcu-test.yml \
              .github/workflows/hcu-static.yml \
              .github/workflows/hcu.yml \
              .github/workflows/pull.yml \
              aten/src/ATen/CMakeLists.txt
          '

      - name: Remove the scoped HCU static container
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HCU_STATIC_LABEL:-}" ]]; then
            exit 0
          fi
          mapfile -t containers < <(docker ps -aq --filter "label=${HCU_STATIC_LABEL}")
          if (( ${#containers[@]} > 0 )); then
            docker rm -f "${containers[@]}"
          fi
