name: HCU CI Static

on:
  pull_request:
    paths:
      - .ci/pytorch/common_utils.sh
      - .github/actions/setup-hcu/**
      - .github/labeler.yml
      - .github/scripts/hcu_ci_manifest.py
      - .github/scripts/hcu_smoke_test.py
      - .github/scripts/test_hcu_ci_contract.py
      - .github/scripts/test_hcu_ci_manifest.py
      - .github/workflows/_hcu-*.yml
      - .github/workflows/hcu*.yml
      - .github/workflows/pull.yml
      - .lintrunner.toml
      - .spin/**
      - aten/src/ATen/CMakeLists.txt
  push:
    paths:
      - .ci/pytorch/common_utils.sh
      - .github/actions/setup-hcu/**
      - .github/labeler.yml
      - .github/scripts/hcu_ci_manifest.py
      - .github/scripts/hcu_smoke_test.py
      - .github/scripts/test_hcu_ci_contract.py
      - .github/scripts/test_hcu_ci_manifest.py
      - .github/workflows/_hcu-*.yml
      - .github/workflows/hcu*.yml
      - .github/workflows/pull.yml
      - .lintrunner.toml
      - .spin/**
      - aten/src/ATen/CMakeLists.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcu-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hcu-static:
    if: ${{ github.repository == 'HYGON-AI/pytorch-das' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install static-check dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            packaging==24.0 \
            PyYAML==6.0.2 \
            spin==0.17 \
            typing-extensions==4.12.2 \
            uv==0.12.0

      - name: Test HCU CI contracts
        run: |
          python3 .github/scripts/test_hcu_ci_contract.py
          python3 .github/scripts/test_hcu_ci_manifest.py

      - name: Lint HCU CI changes
        run: |
          spin quicklint -- \
            --take ACTIONLINT,CMAKE,RUFF,SHELLCHECK \
            .ci/pytorch/common_utils.sh \
            .github/actions/setup-hcu/action.yml \
            .github/scripts/hcu_ci_manifest.py \
            .github/scripts/hcu_smoke_test.py \
            .github/scripts/test_hcu_ci_contract.py \
            .github/scripts/test_hcu_ci_manifest.py \
            .github/workflows/_hcu-build.yml \
            .github/workflows/_hcu-preflight.yml \
            .github/workflows/_hcu-test.yml \
            .github/workflows/hcu-static.yml \
            .github/workflows/hcu.yml \
            .github/workflows/pull.yml \
            aten/src/ATen/CMakeLists.txt
