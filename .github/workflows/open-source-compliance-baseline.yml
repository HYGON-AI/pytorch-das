name: open-source-compliance-baseline

on:
  workflow_dispatch:
    inputs:
      fail_on_hard_findings:
        description: Fail this run when hard findings exist
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    uses: HYGON-AI/open-source-governance/.github/workflows/compliance-baseline-reusable.yml@v0.1.2
    with:
      fail_on_hard_findings: ${{ inputs.fail_on_hard_findings }}
      runner_labels_json: '["self-hosted","linux","x64","internal","quality"]'
      artifact_retention_days: 30
