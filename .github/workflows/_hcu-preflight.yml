name: hcu-preflight

on:
  workflow_call:
    inputs:
      hcu-enabled:
        required: true
        type: boolean
        description: Whether the HYGON HCU CI adapter is explicitly enabled.
      hcu-build-runner:
        required: true
        type: string
        description: Value of vars.HCU_BUILD_RUNNER.
      hcu-test-runner:
        required: true
        type: string
        description: Value of vars.HCU_TEST_RUNNER.
      hcu-ci-image:
        required: true
        type: string
        description: Value of vars.HCU_CI_IMAGE.
      expected-device-count:
        required: true
        type: string
        description: Value of vars.HCU_EXPECTED_DEVICE_COUNT.
      require-same-repository-pr:
        required: false
        default: true
        type: boolean
        description: Reject pull requests whose head repository differs from this repository.
    outputs:
      allowed:
        description: Whether a self-hosted HCU job may be scheduled.
        value: ${{ jobs.preflight.outputs.allowed }}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
    steps:
      - name: Validate HCU CI configuration and event trust
        id: validate
        shell: bash
        env:
          HCU_ENABLED: ${{ inputs.hcu-enabled }}
          HCU_BUILD_RUNNER: ${{ inputs.hcu-build-runner }}
          HCU_TEST_RUNNER: ${{ inputs.hcu-test-runner }}
          HCU_CI_IMAGE: ${{ inputs.hcu-ci-image }}
          HCU_EXPECTED_DEVICE_COUNT: ${{ inputs.expected-device-count }}
          REQUIRE_SAME_REPOSITORY_PR: ${{ inputs.require-same-repository-pr }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${HCU_ENABLED}" != "true" ]]; then
            echo "HCU CI is disabled. Set HCU_CI_ENABLED=true to enable it."
            exit 1
          fi

          for name in HCU_BUILD_RUNNER HCU_TEST_RUNNER HCU_CI_IMAGE HCU_EXPECTED_DEVICE_COUNT; do
            if [[ -z "${!name}" ]]; then
              echo "Required HCU CI repository variable is empty: ${name}" >&2
              exit 1
            fi
          done

          if ! [[ "${HCU_EXPECTED_DEVICE_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "HCU_EXPECTED_DEVICE_COUNT must be a positive integer" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "pull_request" && "${REQUIRE_SAME_REPOSITORY_PR}" == "true" ]]; then
            if [[ "${HEAD_REPOSITORY}" != "${CURRENT_REPOSITORY}" ]]; then
              echo "HCU self-hosted jobs only accept pull requests from this repository" >&2
              exit 1
            fi
          fi

          echo "allowed=true" >> "${GITHUB_OUTPUT}"
