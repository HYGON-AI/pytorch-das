name: hcu-preflight

on:
  workflow_call:
    inputs:
      control-runner:
        required: true
        type: string
        description: Configured self-hosted runner label used for HCU control jobs.
      hcu-enabled:
        required: true
        type: boolean
        description: Whether the HYGON HCU CI adapter is explicitly enabled.
      hcu-build-runner:
        required: true
        type: string
        description: Value of vars.HCU_BUILD_RUNNER.
      hcu-test-runner:
        required: true
        type: string
        description: Value of vars.HCU_TEST_RUNNER.
      hcu-build-image:
        required: true
        type: string
        description: Value of vars.HCU_BUILD_IMAGE.
      hcu-ci-image:
        required: true
        type: string
        description: Value of vars.HCU_CI_IMAGE.
      expected-device-count:
        required: true
        type: string
        description: Value of vars.HCU_EXPECTED_DEVICE_COUNT.
      require-same-repository-pr:
        required: false
        default: true
        type: boolean
        description: Reject pull requests whose head repository differs from this repository.
      enforce-pr-trigger:
        required: false
        default: false
        type: boolean
        description: Require an HCU label or a changed HCU/HIP/ROCm path for pull requests.
      required-pr-label:
        required: false
        default: ciflow/hcu
        type: string
        description: Protected label that explicitly requests the HCU PR workflow.
    outputs:
      allowed:
        description: Whether a self-hosted HCU job may be scheduled.
        value: ${{ jobs.preflight.outputs.allowed }}
      trigger-reason:
        description: Label, path, non-PR event, or rejection reason used by preflight.
        value: ${{ jobs.preflight.outputs.trigger-reason }}

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, "${{ inputs.control-runner }}"]
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
      trigger-reason: ${{ steps.validate.outputs.trigger-reason }}
    steps:
      - name: Validate HCU CI configuration and event trust
        id: validate
        shell: bash
        env:
          HCU_CONTROL_RUNNER: ${{ inputs.control-runner }}
          HCU_ENABLED: ${{ inputs.hcu-enabled }}
          HCU_BUILD_RUNNER: ${{ inputs.hcu-build-runner }}
          HCU_TEST_RUNNER: ${{ inputs.hcu-test-runner }}
          HCU_BUILD_IMAGE: ${{ inputs.hcu-build-image }}
          HCU_CI_IMAGE: ${{ inputs.hcu-ci-image }}
          HCU_EXPECTED_DEVICE_COUNT: ${{ inputs.expected-device-count }}
          REQUIRE_SAME_REPOSITORY_PR: ${{ inputs.require-same-repository-pr }}
          ENFORCE_PR_TRIGGER: ${{ inputs.enforce-pr-trigger }}
          REQUIRED_PR_LABEL: ${{ inputs.required-pr-label }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${HCU_ENABLED}" != "true" ]]; then
            echo "HCU CI is disabled. Set HCU_CI_ENABLED=true to enable it."
            exit 1
          fi

          for name in HCU_CONTROL_RUNNER HCU_BUILD_RUNNER HCU_TEST_RUNNER HCU_BUILD_IMAGE HCU_CI_IMAGE HCU_EXPECTED_DEVICE_COUNT; do
            if [[ -z "${!name}" ]]; then
              echo "Required HCU CI repository variable is empty: ${name}" >&2
              exit 1
            fi
          done

          if ! [[ "${HCU_EXPECTED_DEVICE_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "HCU_EXPECTED_DEVICE_COUNT must be a positive integer" >&2
            exit 1
          fi

          if ! [[ "${HCU_CI_IMAGE}" =~ ^.+@sha256:[0-9a-f]{64}$ ]]; then
            echo "HCU_CI_IMAGE must be pinned to an immutable sha256 digest" >&2
            exit 1
          fi

          if ! [[ "${HCU_BUILD_IMAGE}" =~ ^(.+@)?sha256:[0-9a-f]{64}$ ]]; then
            echo "HCU_BUILD_IMAGE must be a registry digest or an immutable runner-local image ID" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "pull_request" && "${REQUIRE_SAME_REPOSITORY_PR}" == "true" ]]; then
            if [[ "${HEAD_REPOSITORY}" != "${CURRENT_REPOSITORY}" ]]; then
              echo "HCU self-hosted jobs only accept pull requests from this repository" >&2
              exit 1
            fi
          fi

          if [[ "${EVENT_NAME}" == "pull_request" && "${ENFORCE_PR_TRIGGER}" == "true" ]]; then
            pr_response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${CURRENT_REPOSITORY}/pulls/${PR_NUMBER}")"
            mapfile -t pr_metadata < <(
              printf '%s' "${pr_response}" | python3 -c \
                'import json, os, sys
          data = json.load(sys.stdin)
          print(str(data["draft"]).lower())
          print(data["author_association"])
          print(data["head"]["repo"]["full_name"])
          print(str(any(label["name"] == os.environ["REQUIRED_PR_LABEL"] for label in data["labels"])).lower())'
            )
            if (( ${#pr_metadata[@]} != 4 )); then
              echo "GitHub API returned incomplete pull request metadata" >&2
              exit 1
            fi
            api_pr_is_draft="${pr_metadata[0]}"
            api_pr_author_association="${pr_metadata[1]}"
            api_head_repository="${pr_metadata[2]}"
            api_has_required_label="${pr_metadata[3]}"

            if [[ "${api_head_repository}" != "${CURRENT_REPOSITORY}" ]]; then
              echo "GitHub API reports a non-local PR head repository" >&2
              exit 1
            fi
            if [[ "${api_pr_is_draft}" == "true" ]]; then
              echo "allowed=false" >> "${GITHUB_OUTPUT}"
              echo "trigger-reason=draft" >> "${GITHUB_OUTPUT}"
              echo "Draft pull requests do not run HCU build or Smoke."
              exit 0
            fi

            case "${api_pr_author_association}" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                echo "allowed=false" >> "${GITHUB_OUTPUT}"
                echo "trigger-reason=untrusted-author" >> "${GITHUB_OUTPUT}"
                echo "HCU PR CI requires an OWNER, MEMBER, or COLLABORATOR author."
                exit 0
                ;;
            esac

            if [[ "${api_has_required_label}" == "true" ]]; then
              echo "allowed=true" >> "${GITHUB_OUTPUT}"
              echo "trigger-reason=label:${REQUIRED_PR_LABEL}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            hcu_path=""
            for page in $(seq 1 30); do
              response="$(curl --fail --silent --show-error \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${CURRENT_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}")"
              mapfile -t changed_files < <(
                printf '%s' "${response}" | python3 -c \
                  'import json, sys; [print(item["filename"]) for item in json.load(sys.stdin)]'
              )
              for changed_file in "${changed_files[@]}"; do
                case "${changed_file}" in
                  .ci/pytorch/build.sh|.ci/pytorch/common_utils.sh|.ci/pytorch/hcu*.sh|\
                  .github/workflows/hcu*.yml|.github/workflows/hcu*.yaml|\
                  .github/workflows/_hcu-*.yml|.github/workflows/_hcu-*.yaml|\
                  .github/actions/setup-hcu/*|.github/labeler.yml|.github/scripts/hcu_*.py|\
                  .github/scripts/test_hcu_ci_*.py|aten/src/ATen/CMakeLists.txt|\
                  aten/src/ATen/hip/*|aten/src/ATen/native/hip/*|c10/hip/*|\
                  cmake/Dependencies.cmake|cmake/public/LoadHIP.cmake|\
                  test/*hcu*|test/*hip*|test/*rocm*|\
                  third_party/composable_kernel|third_party/composable_kernel/*|\
                  third_party/cutlass|third_party/cutlass/*|\
                  third_party/kineto|third_party/kineto/*|\
                  torch/_inductor/codegen/rocm/*|\
                  torch/utils/hipify/*)
                    hcu_path="${changed_file}"
                    break
                    ;;
                esac
              done
              if [[ -n "${hcu_path}" || ${#changed_files[@]} -lt 100 ]]; then
                break
              fi
              if [[ "${page}" == "30" ]]; then
                echo "Unable to evaluate more than 3000 changed PR files" >&2
                exit 1
              fi
            done

            if [[ -z "${hcu_path}" ]]; then
              echo "allowed=false" >> "${GITHUB_OUTPUT}"
              echo "trigger-reason=unrelated-paths" >> "${GITHUB_OUTPUT}"
              echo "No ${REQUIRED_PR_LABEL} label or HCU/HIP/ROCm critical path change."
              exit 0
            fi
            echo "allowed=true" >> "${GITHUB_OUTPUT}"
            echo "trigger-reason=path" >> "${GITHUB_OUTPUT}"
            printf 'HCU PR CI was triggered by path: %q\n' "${hcu_path}"
            exit 0
          fi

          echo "allowed=true" >> "${GITHUB_OUTPUT}"
          echo "trigger-reason=non-pr-event" >> "${GITHUB_OUTPUT}"
