name: PyTorch 2.12 Build
run-name: PyTorch 2.12 · ${{ github.event_name == 'pull_request' && 'PR tests' || github.event_name == 'schedule' && 'nightly full tests' || github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test coverage to execute after the build.
        required: true
        default: nightly
        type: choice
        options:
          - build-only
          - smoke
          - pr
          - nightly
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - ljz/pytorch-2.12-ci
  schedule:
    # GitHub cron is UTC: 18:00 on Sun/Tue/Thu is 02:00 Beijing time on Mon/Wed/Fri.
    - cron: "0 18 * * 0,2,4"

# The build and every test shard share one local Docker daemon. Prevent two
# active runs from contending for the same DCU host. The bw1100 label must be
# unique to this physical runner because GitHub does not provide job affinity.
concurrency:
  group: pytorch-2.12-bw1100
  cancel-in-progress: false

permissions:
  contents: read

env:
  TORCH_VERSION: "2.12.0"
  DTK_VERSION: "2604"
  PYTHON_VERSION: "3.10"
  DTK_PKG_URL: "http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz"
  DTK_PKG_NAME: "DTK-26.04-rc4-centos8-x86_64.tar.gz"
  ROCM_PATH: "/opt/dtk"
  TOOLKIT_DIR: "/pytorch"
  AMDGPU_TARGETS: "gfx906;gfx926;gfx928;gfx936;gfx938"
  BUILD_ENVIRONMENT: "linux-rocky8.6-rocm-dcu-py3.10"
  TEST_DEPENDENCY_INDEX_URL: "http://10.16.1.201:9929/nightly/dtk2604/+simple/"
  TRITON_TEST_VERSION: "3.7.0"
  TORCHVISION_TEST_INDEX_URL: "http://10.16.1.201:9929/customer/dtk2604-rc4/+simple/"
  TORCHVISION_TEST_VERSION: "0.27.0"
  AICC_BASE_URL: "http://10.16.1.201:8000/ai_cc/nightly/"

jobs:
  preflight:
    name: preflight
    # Never execute untrusted fork code on a self-hosted runner with Docker access.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, bw1100]
    timeout-minutes: 15
    outputs:
      test_suite: ${{ steps.plan.outputs.test_suite }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      expected_shards: ${{ steps.plan.outputs.expected_shards }}
      test_image_name: ${{ steps.plan.outputs.test_image_name }}
      result_root: ${{ steps.plan.outputs.result_root }}
    steps:
      - name: Resolve test plan
        id: plan
        shell: bash
        env:
          REQUESTED_SUITE: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && 'pr' || github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
        run: |
          set -euo pipefail
          case "${REQUESTED_SUITE}" in
            build-only)
              expected_shards=0
              test_matrix='{"include":[{"config":"none","shard":0,"num_shards":0}]}'
              ;;
            smoke)
              expected_shards=1
              test_matrix='{"include":[{"config":"smoke","shard":1,"num_shards":1}]}'
              ;;
            pr)
              expected_shards=2
              # One runner job coordinates two test containers in parallel.
              test_matrix='{"include":[{"config":"pr","shard":0,"num_shards":2}]}'
              ;;
            nightly)
              expected_shards=4
              # One runner job coordinates four two-DCU containers in parallel.
              test_matrix='{"include":[{"config":"default","shard":0,"num_shards":4}]}'
              ;;
            *)
              echo "ERROR: unsupported test suite: ${REQUESTED_SUITE}" >&2
              exit 1
              ;;
          esac

          test_image_name="pytorch-2.12-test:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result_root="/home/github/actions-runner-torch/test-results/${TORCH_VERSION}/${GITHUB_RUN_NUMBER}/${GITHUB_RUN_ATTEMPT}"

          echo "test_suite=${REQUESTED_SUITE}" >> "${GITHUB_OUTPUT}"
          echo "test_matrix=${test_matrix}" >> "${GITHUB_OUTPUT}"
          echo "expected_shards=${expected_shards}" >> "${GITHUB_OUTPUT}"
          echo "test_image_name=${test_image_name}" >> "${GITHUB_OUTPUT}"
          echo "result_root=${result_root}" >> "${GITHUB_OUTPUT}"

          echo "suite=${REQUESTED_SUITE}"
          echo "expected_shards=${expected_shards}"
          echo "test_image=${test_image_name}"
          echo "result_root=${result_root}"

      - name: Check self-hosted build runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          hostname
          docker --version
          docker info >/dev/null
          df -h
          test -d /opt/dtk

      - name: Check DCU test capacity
        if: steps.plan.outputs.test_suite != 'build-only'
        shell: bash
        env:
          PLANNED_TEST_SUITE: ${{ steps.plan.outputs.test_suite }}
        run: |
          set -euo pipefail
          test -x /opt/hyhal/bin/hy-smi
          command -v rocminfo

          /opt/hyhal/bin/hy-smi
          device_count="$(/opt/hyhal/bin/hy-smi | awk '$1 ~ /^[0-9]+$/ { count += 1 } END { print count + 0 }')"
          required_device_count=4
          if [[ "${PLANNED_TEST_SUITE}" == "nightly" ]]; then
            required_device_count=8
          fi
          if (( device_count < required_device_count )); then
            echo "ERROR: expected at least ${required_device_count} DCU devices, found ${device_count}" >&2
            exit 1
          fi
          echo "device_count=${device_count}"

  build:
    name: build
    needs: preflight
    runs-on: [self-hosted, Linux, X64, bw1100]
    timeout-minutes: 4320
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    env:
      TEST_SUITE: ${{ needs.preflight.outputs.test_suite }}
      TEST_IMAGE_NAME: ${{ needs.preflight.outputs.test_image_name }}
      RESULT_ROOT: ${{ needs.preflight.outputs.result_root }}
      IMAGE_NAME: pytorch-2.12-build:${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_NAME: pytorch-2.12-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_RUN_LABEL: org.pytorch.dcu.build=${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Initialize build and result directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_logs
          case "${RESULT_ROOT}" in
            "/home/github/actions-runner-torch/test-results/${TORCH_VERSION}/${GITHUB_RUN_NUMBER}/${GITHUB_RUN_ATTEMPT}") ;;
            *)
              echo "ERROR: unexpected result directory: ${RESULT_ROOT}" >&2
              exit 1
              ;;
          esac
          rm -rf -- "${RESULT_ROOT}"
          mkdir -p "${RESULT_ROOT}"

      - name: Check build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci/pytorch/torch-2.12-ci/Dockerfile
          test -f .ci/pytorch/torch-2.12-ci/prepare.sh
          test -f .ci/pytorch/torch-2.12-ci/build.sh
          test -f .ci/pytorch/torch-2.12-ci/pr-tests.txt
          test -f .ci/pytorch/torch-2.12-ci/pr-skipped-tests.txt
          test -f .ci/pytorch/torch-2.12-ci/rebuild-wheel-record.py
          test -f .ci/pytorch/torch-2.12-ci/install-aicc.sh
          python3 .ci/pytorch/torch-2.12-ci/test_rebuild_wheel_record.py
          python3 .ci/pytorch/torch-2.12-ci/test_junit_test_stats.py
          python3 .ci/pytorch/torch-2.12-ci/test_dcu_pr_skip_plugin.py
          bash .ci/pytorch/torch-2.12-ci/test-install-aicc.sh
          bash .ci/pytorch/torch-2.12-ci/test-pr-environment-policy.sh
          bash .ci/pytorch/torch-2.12-ci/test-pr-hang-policy.sh
          bash .ci/pytorch/torch-2.12-ci/test-parallel-containers.sh
          test -f .ci/pytorch/torch-2.12-ci/run-nightly-test-in-container.sh
          test -f .ci/pytorch/torch-2.12-ci/run-nightly-tests.sh

      - name: Build PyTorch 2.12 compile image
        shell: bash
        run: |
          set -o pipefail
          chmod +x .ci/pytorch/torch-2.12-ci/build-image.sh
          chmod +x .ci/pytorch/torch-2.12-ci/prepare.sh
          chmod +x .ci/pytorch/torch-2.12-ci/build.sh
          bash .ci/pytorch/torch-2.12-ci/build-image.sh \
            "${DTK_PKG_URL}" \
            "${IMAGE_NAME}" \
            "${PYTHON_VERSION}" \
            2>&1 | tee build_logs/docker-build.log

      - name: Start compile container
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --label "${BUILD_RUN_LABEL}" \
            --label "org.pytorch.dcu.workflow-run=${GITHUB_RUN_ID}" \
            --label "org.pytorch.dcu.workflow-attempt=${GITHUB_RUN_ATTEMPT}" \
            --network host \
            --ipc host \
            --shm-size=64g \
            -v /opt/hyhal:/opt/hyhal:ro \
            "${IMAGE_NAME}" \
            tail -f /dev/null
          docker ps --filter "name=${CONTAINER_NAME}"

      - name: Build PyTorch wheel
        shell: bash
        run: |
          set -o pipefail
          docker exec \
            -e ROCM_PATH="/opt/dtk" \
            -e TOOLKIT_DIR="/pytorch" \
            -e TORCH_VERSION \
            -e DTK_VERSION \
            -e AMDGPU_TARGETS="${AMDGPU_TARGETS}" \
            -e GIT_COMMIT_SHORT="${GITHUB_SHA:0:6}" \
            -e MAX_JOBS="$(nproc --ignore=2)" \
            "${CONTAINER_NAME}" \
            bash -lc "/usr/local/bin/build-pytorch.sh" \
            2>&1 | tee build_logs/pytorch-build.log

      - name: Collect wheel in container
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -e
            mkdir -p /dist
            if compgen -G "/dist/*.whl" > /dev/null; then
              echo "Wheel already exists in /dist"
            elif compgen -G "/pytorch/dist/*.whl" > /dev/null; then
              cp -v /pytorch/dist/*.whl /dist/
            else
              echo "ERROR: no wheel found"
              find /pytorch -maxdepth 3 -name "*.whl" -type f || true
              exit 1
            fi
            echo "===== Generated wheels ====="
            ls -lh /dist/*.whl
          '

      - name: Copy wheel from container
        shell: bash
        run: |
          set -euo pipefail
          save_dir="/home/github/actions-runner-torch/dist/${TORCH_VERSION}/${GITHUB_RUN_NUMBER}/${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${save_dir}"
          mkdir -p "${save_dir}"
          docker cp "${CONTAINER_NAME}:/dist/." "${save_dir}/"
          echo "===== wheel saved ====="
          ls -lh "${save_dir}"

      - name: Prepare local test image
        if: env.TEST_SUITE != 'build-only'
        shell: bash
        run: |
          set -euo pipefail
          docker exec \
            -e TEST_SUITE \
            -e TEST_DEPENDENCY_INDEX_URL \
            -e TRITON_TEST_VERSION \
            -e TORCHVISION_TEST_INDEX_URL \
            -e TORCHVISION_TEST_VERSION \
            -e AICC_BASE_URL \
            "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /pytorch
            shopt -s nullglob
            repaired_wheels=(/dist/*manylinux*.whl)
            shopt -u nullglob
            if (( ${#repaired_wheels[@]} != 1 )); then
              echo "ERROR: expected one repaired manylinux wheel, found ${#repaired_wheels[@]}" >&2
              exit 1
            fi

            rm -rf dist
            mkdir -p dist/test-deps dist/vision
            cp -v "${repaired_wheels[0]}" dist/

            if [[ "${TEST_SUITE}" == "pr" || "${TEST_SUITE}" == "nightly" ]]; then
              chmod 755 .ci/pytorch/torch-2.12-ci/install-aicc.sh
              .ci/pytorch/torch-2.12-ci/install-aicc.sh
              chmod 755 .ci/pytorch/torch-2.12-ci/install-dcu-test-compat.sh
              .ci/pytorch/torch-2.12-ci/install-dcu-test-compat.sh

              download_test_wheel() {
                local destination="$1"
                local index_url="$2"
                local package="$3"
                local version="$4"
                python3 -m pip download \
                  --no-cache-dir \
                  --no-deps \
                  --only-binary=:all: \
                  --index-url "${index_url}" \
                  --trusted-host 10.16.1.201 \
                  --dest "${destination}" \
                  "${package}==${version}"
              }

              download_test_wheel \
                dist/test-deps "${TEST_DEPENDENCY_INDEX_URL}" triton "${TRITON_TEST_VERSION}"
              download_test_wheel \
                dist/vision "${TORCHVISION_TEST_INDEX_URL}" torchvision "${TORCHVISION_TEST_VERSION}"

              shopt -s nullglob
              triton_wheels=(dist/test-deps/triton-*.whl)
              torchvision_wheels=(dist/vision/torchvision-*.whl)
              shopt -u nullglob
              if (( ${#triton_wheels[@]} != 1 )); then
                echo "ERROR: expected one Triton wheel, found ${#triton_wheels[@]}" >&2
                exit 1
              fi
              if (( ${#torchvision_wheels[@]} != 1 )); then
                echo "ERROR: expected one torchvision wheel, found ${#torchvision_wheels[@]}" >&2
                exit 1
              fi
              echo "Resolved latest Triton ${TRITON_TEST_VERSION}: ${triton_wheels[0]}"
              sha256sum "${triton_wheels[0]}"
              echo "Resolved latest torchvision ${TORCHVISION_TEST_VERSION}: ${torchvision_wheels[0]}"
              sha256sum "${torchvision_wheels[0]}"

              python3 -m pip install --no-deps --force-reinstall dist/test-deps/*.whl
              python3 -c "import triton; print(\"Triton module:\", getattr(triton, \"__version__\", \"unknown\")); print(\"Triton path:\", triton.__file__)"
            fi

            required_paths=(
              dist
              build/custom_test_artifacts
              build/lib
              build/bin
              .additional_ci_files
              .ci/pytorch/torch-2.12-ci/amd-smi
              .ci/pytorch/torch-2.12-ci/dcu_pr_skip_plugin.py
              .ci/pytorch/torch-2.12-ci/install-aicc.sh
              .ci/pytorch/torch-2.12-ci/install-dcu-test-compat.sh
              .ci/pytorch/torch-2.12-ci/pr-skipped-tests.txt
              .ci/pytorch/torch-2.12-ci/pr-tests.txt
            )
            for path in "${required_paths[@]}"; do
              test -e "${path}"
            done
            find dist -maxdepth 2 -type f -name "*.whl" -ls
          '

          aicc_installer="not-installed"
          if [[ "${TEST_SUITE}" == "pr" || "${TEST_SUITE}" == "nightly" ]]; then
            aicc_installer="$(docker exec "${CONTAINER_NAME}" cat /opt/dtk/.info/aicc_installer_name)"
          fi

          docker image rm -f "${TEST_IMAGE_NAME}" 2>/dev/null || true
          docker commit \
            --change "LABEL org.pytorch.dcu.source-sha=${GITHUB_SHA}" \
            --change "LABEL org.pytorch.dcu.workflow-run=${GITHUB_RUN_ID}" \
            --change "LABEL org.pytorch.dcu.workflow-attempt=${GITHUB_RUN_ATTEMPT}" \
            --change "LABEL org.pytorch.dcu.aicc-installer=${aicc_installer}" \
            "${CONTAINER_NAME}" "${TEST_IMAGE_NAME}"
          docker image inspect "${TEST_IMAGE_NAME}" \
            --format 'test image={{.RepoTags}} size={{.Size}} labels={{json .Config.Labels}}'

      - name: Save build logs locally
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          log_dir="/home/github/actions-runner-torch/log-torch/${GITHUB_RUN_NUMBER}/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${log_dir}"
          if [[ -d source/build_logs ]]; then
            cp source/build_logs/*.log "${log_dir}/" 2>/dev/null || true
            if [[ -n "${RESULT_ROOT}" && -d "${RESULT_ROOT}" ]]; then
              mkdir -p "${RESULT_ROOT}/build_logs"
              cp source/build_logs/*.log "${RESULT_ROOT}/build_logs/" 2>/dev/null || true
            fi
          fi
          echo "===== build logs ====="
          find "${log_dir}" -maxdepth 1 -type f -ls

      - name: Cleanup compile container and image
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          mapfile -t build_containers < <(
            docker ps -aq --filter "label=${BUILD_RUN_LABEL}"
          )
          if (( ${#build_containers[@]} > 0 )); then
            docker rm -f "${build_containers[@]}"
          fi
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          docker image rm -f "${IMAGE_NAME}" 2>/dev/null || true

  dcu-test:
    name: dcu-test
    needs: [preflight, build]
    if: ${{ needs.preflight.outputs.test_suite != 'build-only' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_pytorch-2.12-dcu-test.yml
    with:
      test_suite: ${{ needs.preflight.outputs.test_suite }}
      test_matrix: ${{ needs.preflight.outputs.test_matrix }}
      test_image_name: ${{ needs.preflight.outputs.test_image_name }}
      result_root: ${{ needs.preflight.outputs.result_root }}
      build_environment: linux-rocky8.6-rocm-dcu-py3.10
      expected_device_count: ${{ needs.preflight.outputs.test_suite == 'nightly' && '8' || '4' }}
      dcu_visible_devices: "0,1"
      pr_dcu_device_pairs: "4,5;6,7"
      nightly_dcu_device_pairs: "0,1;2,3;4,5;6,7"

  required:
    name: test-required
    needs: [preflight, build, dcu-test]
    # Run after failed/skipped dependencies, but honor an explicit user cancel.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, bw1100]
    timeout-minutes: 30
    env:
      TEST_SUITE: ${{ needs.preflight.outputs.test_suite }}
      EXPECTED_SHARDS: ${{ needs.preflight.outputs.expected_shards }}
      TEST_IMAGE_NAME: ${{ needs.preflight.outputs.test_image_name }}
      RESULT_ROOT: ${{ needs.preflight.outputs.result_root }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      TEST_RESULT: ${{ needs.dcu-test.result }}
    steps:
      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Summarize required jobs and DCU tests
        id: test_summary
        shell: bash
        run: |
          set -euo pipefail
          infrastructure_failed=0

          {
            echo "## PyTorch 2.12 DCU pipeline"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| preflight | ${PREFLIGHT_RESULT} |"
            echo "| build | ${BUILD_RESULT} |"
            echo "| dcu-test | ${TEST_RESULT} |"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${PREFLIGHT_RESULT}" != "success" ]]; then
            echo "::error title=Preflight failed::result=${PREFLIGHT_RESULT}"
            infrastructure_failed=1
          fi
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "::error title=Build failed::result=${BUILD_RESULT}"
            infrastructure_failed=1
          fi

          if [[ "${TEST_SUITE}" == "build-only" ]]; then
            if [[ "${TEST_RESULT}" != "skipped" && "${TEST_RESULT}" != "success" ]]; then
              echo "::error title=Unexpected test result::build-only test result=${TEST_RESULT}"
              infrastructure_failed=1
            fi
            echo "Build-only run: no DCU test shards were requested." >> "${GITHUB_STEP_SUMMARY}"
          else
            if [[ "${TEST_RESULT}" != "success" ]]; then
              echo "::error title=DCU test infrastructure failed::result=${TEST_RESULT}"
              infrastructure_failed=1
            fi

            if [[ -z "${RESULT_ROOT}" || -z "${EXPECTED_SHARDS}" ]]; then
              echo "::error title=Missing test plan::result directory or shard count is empty"
              infrastructure_failed=1
            else
              expected_config="${TEST_SUITE}"
              if [[ "${TEST_SUITE}" == "nightly" ]]; then
                expected_config="default"
              fi
              set +e
              python3 \
                "${GITHUB_WORKSPACE}/source/.ci/pytorch/torch-2.12-ci/summarize-nightly-tests.py" \
                --result-root "${RESULT_ROOT}" \
                --expected-shards "${EXPECTED_SHARDS}" \
                --expected-config "${expected_config}" \
                --step-summary "${GITHUB_STEP_SUMMARY}" \
                --github-output "${GITHUB_OUTPUT}"
              summary_rc=$?
              set -e
              if (( summary_rc != 0 )); then
                infrastructure_failed=1
              fi
            fi
          fi

          if (( infrastructure_failed != 0 )); then
            exit 1
          fi

      - name: Upload both wheels to DevPI after basic tests
        if: ${{ needs.preflight.outputs.test_suite == 'pr' && steps.test_summary.outputs.all_tests_passed == 'true' }}
        shell: bash
        env:
          DEVPI_URL: "http://10.16.1.201:9929"
          DEVPI_USER: "nightly"
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${PYPI_PASSWORD}" ]]; then
            echo "::error title=Missing DevPI credential::GitHub Secret PYPI_PASSWORD is empty"
            exit 1
          fi
          docker image inspect "${TEST_IMAGE_NAME}" >/dev/null

          printf '%s\n' "${PYPI_PASSWORD}" |
            docker run --rm -i \
              --label "org.pytorch.dcu.workflow-run=${GITHUB_RUN_ID}" \
              --label "org.pytorch.dcu.workflow-attempt=${GITHUB_RUN_ATTEMPT}" \
              --network host \
              --env DEVPI_URL \
              --env DEVPI_USER \
              --env DTK_PKG_NAME \
              "${TEST_IMAGE_NAME}" \
              bash -lc '
              set -euo pipefail
              IFS= read -r devpi_password
              if [[ -z "${devpi_password}" ]]; then
                echo "ERROR: DevPI password was not provided" >&2
                exit 1
              fi
              shopt -s nullglob
              wheels=(/dist/*.whl)
              linux_wheels=(/dist/*-linux_x86_64.whl)
              manylinux_wheels=(/dist/*manylinux*.whl)
              shopt -u nullglob

              if (( ${#wheels[@]} != 2 )); then
                echo "ERROR: expected exactly two wheels in /dist, found ${#wheels[@]}" >&2
                find /dist -maxdepth 1 -type f -ls || true
                exit 1
              fi
              if (( ${#linux_wheels[@]} != 1 || ${#manylinux_wheels[@]} != 1 )); then
                echo "ERROR: expected one linux wheel and one manylinux wheel" >&2
                printf "  %s\n" "${wheels[@]}" >&2
                exit 1
              fi

              echo "===== CIUpload ====="
              command -v CIUpload
              CIUpload --help >/dev/null
              echo "===== Wheels selected for upload ====="
              ls -lh "${wheels[@]}"
              sha256sum "${wheels[@]}"

              CIUpload \
                --devpi_url "${DEVPI_URL}" \
                --devpi_user "${DEVPI_USER}" \
                --devpi_password "${devpi_password}" \
                --dtk_pkg_name "${DTK_PKG_NAME}" \
                -f "${wheels[@]}"
            '

          {
            echo
            echo "## DevPI upload"
            echo
            echo "Uploaded both Linux and manylinux wheels after all basic-test shards passed."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record skipped DevPI upload
        if: ${{ !cancelled() && needs.preflight.outputs.test_suite == 'pr' && steps.test_summary.outputs.all_tests_passed == 'false' && steps.test_summary.outputs.failed_infrastructure_shards == '0' }}
        shell: bash
        run: |
          echo "::warning title=DevPI upload skipped::One or more basic-test shards did not pass"
          {
            echo
            echo "## DevPI upload"
            echo
            echo "Skipped because not every basic-test shard passed."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup workflow-scoped containers and images
        if: always()
        shell: bash
        run: |
          set +e
          if ! command -v docker >/dev/null 2>&1; then
            exit 0
          fi

          mapfile -t containers < <(
            docker ps -aq \
              --filter "label=org.pytorch.dcu.workflow-run=${GITHUB_RUN_ID}" \
              --filter "label=org.pytorch.dcu.workflow-attempt=${GITHUB_RUN_ATTEMPT}"
          )
          if (( ${#containers[@]} > 0 )); then
            docker rm -f "${containers[@]}"
          fi

          if [[ -n "${TEST_IMAGE_NAME}" ]]; then
            docker image rm -f "${TEST_IMAGE_NAME}" 2>/dev/null || true
          fi
          docker image rm -f \
            "pytorch-2.12-build:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            2>/dev/null || true

      - name: Fail PR after reporting all test failures
        if: ${{ !cancelled() && needs.preflight.outputs.test_suite == 'pr' && steps.test_summary.outputs.failed_test_shards != '0' && steps.test_summary.outputs.failed_infrastructure_shards == '0' }}
        shell: bash
        env:
          FAILED_TEST_SHARDS: ${{ steps.test_summary.outputs.failed_test_shards }}
        run: |
          echo "::error title=PR tests failed::${FAILED_TEST_SHARDS} test shard(s) failed after all shards completed"
          echo "PR tests failed after all shards completed: failed_test_shards=${FAILED_TEST_SHARDS}" >&2
          exit 1
