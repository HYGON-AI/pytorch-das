name: PyTorch 2.12 Build
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test coverage to execute after the build.
        required: true
        default: nightly
        type: choice
        options:
          - build-only
          - smoke
          - nightly
  push:
    branches:
      - ljz/pytorch-2.12-ci
  schedule:
    - cron: 0 18 * * *
permissions:
  contents: read
jobs:
  build:
    runs-on: 
      - self-hosted          
      - Linux
      - X64
      - bw1100
    timeout-minutes: 4320
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    env:
      TORCH_VERSION: "2.12.0"
      DTK_VERSION: "2604"
      PYTHON_VERSION: "3.10"
      DTK_PKG_URL: "http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz"
      DTK_PKG_NAME: "DTK-26.04-rc4-centos8-x86_64.tar.gz"
      #CIUPLOAD_INDEX_URL: "http://10.16.1.201:9929/open/deps/+simple/"
      ROCM_PATH: "/opt/dtk"
      TOOLKIT_DIR: "/pytorch"
      AMDGPU_TARGETS: "gfx906;gfx926;gfx928;gfx936;gfx938"
      IMAGE_NAME: "pytorch-2.12-build:${{ github.run_id }}"
      TEST_IMAGE_NAME: "pytorch-2.12-nightly-test:${{ github.run_id }}"
      CONTAINER_NAME: "pytorch-2.12-${{ github.run_id }}"
      BUILD_ENVIRONMENT: "linux-rocky8.6-rocm-dcu-py3.10"
      # Resolve the newest compatible DCU Triton 3.7.1 wheel on every nightly.
      # pip selects the correct Python/platform wheel from this internal index.
      TRITON_TEST_INDEX_URL: "http://10.16.1.201:9929/das_nightly/dtk2604-rc4/+simple/"
      TRITON_TEST_VERSION: "3.7.1"
      TORCHVISION_TEST_WHEEL_URL: "http://10.16.1.201:9929/customer/dtk2604-rc4/+f/8ae/19466a791590e/torchvision-0.27.0+das.opt1.dtk2604.torch2120.2607011049.g2a8274-cp310-cp310-manylinux_2_28_x86_64.whl"
      TORCHVISION_TEST_WHEEL_SHA256: "8ae19466a791590e32df45583be428306cbcb59f4bf9f53a46ef29166e4ed636"
      # release/2.12 rocm-nightly.yml runs six shards of TEST_CONFIG=default.
      # Branch pushes keep using smoke so ordinary development does not launch
      # the multi-hour nightly suite; schedule/manual nightly runs use all six.
      TEST_SUITE: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
    steps:
      # 1. 拉取当前个人分支的 PyTorch 源码
      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          path: source
      - name: Set build context
        shell: bash
        run: |
         echo "BUILD_CONTEXT=${RUNNER_TEMP}/pytorch-2.12-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
      # 2. 检查 self-hosted runner 环境
      - name: Check runner environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "===== Host ====="
          hostname
          echo "===== Current branch ====="
          echo "${GITHUB_REF_NAME}"
          echo "===== Docker ====="
          docker --version
          echo "===== Disk ====="
          df -h
          echo "===== DTK ====="
          test -d /opt/dtk
          ls -la /opt/dtk | head -n 20
          echo "===== CI files ====="
          test -f .ci/pytorch/torch-2.12-ci/Dockerfile
          test -f .ci/pytorch/torch-2.12-ci/prepare.sh
          test -f .ci/pytorch/torch-2.12-ci/build.sh
      - name: Build PyTorch 2.12 compile image
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build_logs
          chmod +x .ci/pytorch/torch-2.12-ci/build-image.sh
          chmod +x .ci/pytorch/torch-2.12-ci/prepare.sh
          chmod +x .ci/pytorch/torch-2.12-ci/build.sh
          bash .ci/pytorch/torch-2.12-ci/build-image.sh \
            "${DTK_PKG_URL}" \
            "${IMAGE_NAME}" \
            "${PYTHON_VERSION}" \
            2>&1 | tee build_logs/docker-build.log
      # 启动编译容器
      - name: Start compile container
        shell: bash
        run: |
          set -euxo pipefail
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --network host \
            --ipc host \
            --shm-size=64g \
            -v /opt/hyhal:/opt/hyhal:ro \
            "${IMAGE_NAME}" \
            tail -f /dev/null
          docker ps \
            --filter "name=${CONTAINER_NAME}"
      # 在容器内执行 build.sh
      - name: Build PyTorch wheel
        shell: bash
        run: |
          set -o pipefail
          docker exec \
            -e ROCM_PATH="/opt/dtk" \
            -e TOOLKIT_DIR="/pytorch" \
            -e PKG_TYPE="nightly" \
            -e AMDGPU_TARGETS="${AMDGPU_TARGETS}" \
            -e GIT_COMMIT_SHORT="${GITHUB_SHA:0:6}" \
            -e MAX_JOBS="$(nproc --ignore=2)" \
            "${CONTAINER_NAME}" \
            bash -lc "/usr/local/bin/build-pytorch.sh" \
            2>&1 | tee build_logs/pytorch-build.log
      # 确认 wheel 并统一放到容器 /dist
      - name: Collect wheel in container
        shell: bash
        run: |
          set -euxo pipefail
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -e
            mkdir -p /dist
            if compgen -G "/dist/*.whl" > /dev/null; then
              echo "Wheel already exists in /dist"
            elif compgen -G "/pytorch/dist/*.whl" > /dev/null; then
              cp -v /pytorch/dist/*.whl /dist/
            else
              echo "ERROR: no wheel found"
              find /pytorch -maxdepth 3 -name "*.whl" -type f || true
              exit 1
            fi
            echo "===== Generated wheels ====="
            ls -lh /dist/*.whl
          '
      # 从容器复制 wheel 到 runner 本地固定目录
      - name: Copy wheel from container
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          SAVE_DIR="/home/github/actions-runner-torch/dist/${TORCH_VERSION}/${GITHUB_RUN_NUMBER}"
          rm -rf "${SAVE_DIR}"
          mkdir -p "${SAVE_DIR}"
          docker cp \
            "${CONTAINER_NAME}:/dist/." \
            "${SAVE_DIR}/"
          echo "===== wheel saved ====="
          ls -lh "${SAVE_DIR}"
        #接收编译产物  
      - name: Prepare local nightly test image
        if: env.TEST_SUITE != 'build-only'
        shell: bash
        run: |
          set -euxo pipefail
          docker exec \
            -e TEST_SUITE \
            -e TRITON_TEST_INDEX_URL \
            -e TRITON_TEST_VERSION \
            -e TORCHVISION_TEST_WHEEL_URL \
            -e TORCHVISION_TEST_WHEEL_SHA256 \
            "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /pytorch
            shopt -s nullglob
            repaired_wheels=(/dist/*manylinux*.whl)
            shopt -u nullglob
            if (( ${#repaired_wheels[@]} != 1 )); then
              echo "ERROR: expected one repaired manylinux wheel, found ${#repaired_wheels[@]}" >&2
              exit 1
            fi

            rm -rf dist
            mkdir -p dist/test-deps dist/vision
            cp -v "${repaired_wheels[0]}" dist/

            if [[ "${TEST_SUITE}" == "nightly" ]]; then
              download_verified_wheel() {
                local url="$1"
                local destination="$2"
                local expected_sha256="$3"
                local filename="${url##*/}"
                wget --tries=3 --timeout=120 -O "${destination}/${filename}" "${url}"
                printf "%s  %s\n" \
                  "${expected_sha256}" "${destination}/${filename}" | sha256sum -c -
              }

              python3 -m pip download \
                --no-cache-dir \
                --no-deps \
                --index-url "${TRITON_TEST_INDEX_URL}" \
                --trusted-host 10.16.1.201 \
                --dest dist/test-deps \
                "triton==${TRITON_TEST_VERSION}"

              shopt -s nullglob
              triton_wheels=(dist/test-deps/triton-*.whl)
              shopt -u nullglob
              if (( ${#triton_wheels[@]} != 1 )); then
                echo "ERROR: expected one Triton wheel, found ${#triton_wheels[@]}" >&2
                exit 1
              fi
              echo "Resolved latest Triton ${TRITON_TEST_VERSION}: ${triton_wheels[0]}"
              sha256sum "${triton_wheels[0]}"

              download_verified_wheel \
                "${TORCHVISION_TEST_WHEEL_URL}" dist/vision "${TORCHVISION_TEST_WHEEL_SHA256}"

              # Triton must be importable when an official default shard starts.
              # torchvision stays in dist/vision for install_torchvision().
              python3 -m pip install --no-deps --force-reinstall dist/test-deps/*.whl
              python3 -c "import triton; assert triton.__version__.split(\"+\", 1)[0] == \"${TRITON_TEST_VERSION}\"; print(\"Triton:\", triton.__version__)"
            fi

            required_paths=(
              dist
              build/custom_test_artifacts
              build/lib
              build/bin
              .additional_ci_files
            )
            for path in "${required_paths[@]}"; do
              test -e "${path}"
            done
            find dist -maxdepth 2 -type f -name "*.whl" -ls
          '
          docker image rm -f "${TEST_IMAGE_NAME}" 2>/dev/null || true
          docker commit "${CONTAINER_NAME}" "${TEST_IMAGE_NAME}"
          docker image inspect "${TEST_IMAGE_NAME}" \
            --format 'nightly test image={{.RepoTags}} size={{.Size}}'
      - name: Validate DCU runner
        if: env.TEST_SUITE != 'build-only'
        uses: ./source/.github/actions/setup-hcu
        with:
          expected-device-count: "4"
          run-label: pytorch-2.12-dcu-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run DCU tests
        if: env.TEST_SUITE != 'build-only'
        shell: bash
        env:
          DOCKER_IMAGE_NAME: ${{ env.TEST_IMAGE_NAME }}
          REPORT_ROOT: ${{ github.workspace }}/source/test-results
        run: |
          set -o pipefail
          mkdir -p test-results
          chmod +x .ci/pytorch/torch-2.12-ci/run-nightly-tests.sh
          .ci/pytorch/torch-2.12-ci/run-nightly-tests.sh
      - name: Save test results locally
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_RESULT_DIR="/home/github/actions-runner-torch/test-results/${TORCH_VERSION}/${GITHUB_RUN_NUMBER}"
          mkdir -p "${LOCAL_RESULT_DIR}"
          if [[ -d test-results ]]; then
            cp -a test-results/. "${LOCAL_RESULT_DIR}/"
          fi
          if [[ -d build_logs ]]; then
            mkdir -p "${LOCAL_RESULT_DIR}/build_logs"
            cp -a build_logs/. "${LOCAL_RESULT_DIR}/build_logs/"
          fi
          echo "===== local test results ====="
          find "${LOCAL_RESULT_DIR}" -maxdepth 3 -type f -ls | head -n 100
      # 在编译容器内上传wheel
      # - name: Install CIUpload and upload wheels
      #   if: success()
      #   shell: bash
      #   env:
      #     PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      #   run: |
      #     set -euo pipefail
      #     docker exec \
      #       -e PYPI_PASSWORD \
      #       -e DTK_PKG_URL \
      #       "${CONTAINER_NAME}" \
      #       bash -lc '
      #         set -euo pipefail
      #         echo "===== CIUpload 信息 ====="
      #         command -v CIUpload
      #         CIUpload --help >/dev/null
      #         echo "===== 准备上传的 wheel ====="
      #         ls -lh /dist/*.whl
      #         CIUpload \
      #           --devpi_url "http://10.16.1.201:9929" \
      #           --devpi_user "nightly" \
      #           --devpi_password "${PYPI_PASSWORD}" \
      #           --dtk_pkg_name "$(basename "${DTK_PKG_URL}")" \
      #           -f /dist/*.whl
      #       '
      # 上传日志
      - name: Save build result locally
        if: always()
        shell: bash
        run: |
          set -e
          LOG_ROOT="/home/github/actions-runner-torch/log-torch"
          LOG_DIR="${LOG_ROOT}/${GITHUB_RUN_NUMBER}"
          mkdir -p "${LOG_DIR}"
          echo "保存构建日志到: ${LOG_DIR}"
          cp build_logs/*.log \
            "${LOG_DIR}/" 2>/dev/null || true
          echo "===== log files ====="
          ls -lh "${LOG_DIR}"
        #清理容器和临时镜像
      - name: Cleanup containers and image
        if: always()
        shell: bash
        run: |
          set +e
          mapfile -t test_containers < <(
            docker ps -aq --filter "label=org.pytorch.dcu.nightly=${GITHUB_RUN_ID}"
          )
          if (( ${#test_containers[@]} > 0 )); then
            docker rm -f "${test_containers[@]}"
          fi
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          docker image rm -f "${TEST_IMAGE_NAME}" 2>/dev/null || true
          docker image rm -f "${IMAGE_NAME}" 2>/dev/null || true
          rm -rf -- "${BUILD_CONTEXT}"
