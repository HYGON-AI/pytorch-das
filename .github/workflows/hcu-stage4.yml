name: HCU Stage 4

on:
  push:
    tags:
      - ciflow/hcu/default-1-of-8-*
  workflow_dispatch:
    inputs:
      tests-to-include:
        description: Space-separated tests passed to the existing PyTorch test runner.
        required: false
        default: ""
        type: string
      reuse-artifact-path:
        description: Absolute runner-local path of a previously verified HCU build artifact.
        required: false
        default: ""
        type: string
      reuse-source-sha:
        description: Exact source SHA recorded in the reused wheel manifest.
        required: false
        default: ""
        type: string

concurrency:
  group: hcu-stage4-${{ github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  hcu-preflight:
    if: ${{ github.repository == 'HYGON-AI/pytorch-das' && vars.HCU_CI_ENABLED == 'true' }}
    uses: ./.github/workflows/_hcu-preflight.yml
    with:
      control-runner: ${{ vars.HCU_CONTROL_RUNNER }}
      hcu-enabled: true
      hcu-build-runner: ${{ vars.HCU_BUILD_RUNNER }}
      hcu-test-runner: ${{ vars.HCU_TEST_RUNNER }}
      hcu-build-image: ${{ vars.HCU_BUILD_IMAGE }}
      hcu-ci-image: ${{ vars.HCU_CI_IMAGE }}
      expected-device-count: ${{ vars.HCU_EXPECTED_DEVICE_COUNT }}

  hcu-build:
    if: >-
      ${{
        needs.hcu-preflight.outputs.allowed == 'true' &&
        (
          github.event_name != 'workflow_dispatch' ||
          (
            inputs.reuse-artifact-path == '' &&
            inputs.reuse-source-sha == ''
          )
        )
      }}
    needs: hcu-preflight
    uses: ./.github/workflows/_hcu-build.yml
    with:
      runner: ${{ vars.HCU_BUILD_RUNNER }}
      build-image: ${{ vars.HCU_BUILD_IMAGE }}
      artifact-name: hcu-build-${{ github.run_id }}-${{ github.run_attempt }}
      artifact-root: /home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-artifacts
      build-environment: linux-rocky8-rocm-dtk2604-hcu-py3.10
      rocm-arch: gfx938
      max-jobs: 32

  hcu-reuse-artifact:
    if: >-
      ${{
        needs.hcu-preflight.outputs.allowed == 'true' &&
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.reuse-artifact-path != '' ||
          inputs.reuse-source-sha != ''
        )
      }}
    needs: hcu-preflight
    runs-on: ${{ vars.HCU_TEST_RUNNER }}
    outputs:
      artifact-path: ${{ steps.reuse.outputs.artifact-path }}
      runner-name: ${{ steps.reuse.outputs.runner-name }}
      build-environment: ${{ steps.reuse.outputs.build-environment }}
      image-digest: ${{ steps.reuse.outputs.image-digest }}
      source-sha: ${{ steps.reuse.outputs.source-sha }}
    steps:
      - name: Restore runner workspace ownership before artifact reuse
        shell: bash
        env:
          HCU_CI_IMAGE: ${{ vars.HCU_CI_IMAGE }}
        run: |
          set -euo pipefail
          if ! docker image inspect "${HCU_CI_IMAGE}" > /dev/null 2>&1; then
            echo "HCU CI image is not available locally: ${HCU_CI_IMAGE}" >&2
            exit 1
          fi
          workspace_owner="$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")"
          docker run --rm --user 0:0 \
            --volume "${GITHUB_WORKSPACE}:/var/lib/jenkins/workspace" \
            --entrypoint chown \
            "${HCU_CI_IMAGE}" \
            -R "${workspace_owner}" /var/lib/jenkins/workspace

      - name: Checkout current tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch wheel source commit
        shell: bash
        env:
          REUSE_ARTIFACT_PATH: ${{ inputs.reuse-artifact-path }}
          REUSE_SOURCE_SHA: ${{ inputs.reuse-source-sha }}
        run: |
          set -euo pipefail
          if [[ -z "${REUSE_ARTIFACT_PATH}" || ! "${REUSE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Both reuse-artifact-path and a 40-character reuse-source-sha are required." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "${REUSE_SOURCE_SHA}"

      - name: Validate runner-local wheel reuse
        id: reuse
        shell: bash
        env:
          REUSE_ARTIFACT_PATH: ${{ inputs.reuse-artifact-path }}
          REUSE_SOURCE_SHA: ${{ inputs.reuse-source-sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/hcu_artifact_reuse.py \
            --artifact-root /home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-artifacts \
            --artifact-path "${REUSE_ARTIFACT_PATH}" \
            --repository "${GITHUB_REPOSITORY}" \
            --reuse-source-sha "${REUSE_SOURCE_SHA}" \
            --current-sha "${GITHUB_SHA}" \
            --runner-name "${RUNNER_NAME}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --github-output "${GITHUB_OUTPUT}"

  hcu-test:
    if: >-
      ${{
        always() &&
        (
          needs.hcu-build.result == 'success' ||
          needs.hcu-reuse-artifact.result == 'success'
        )
      }}
    needs: [hcu-build, hcu-reuse-artifact]
    uses: ./.github/workflows/_hcu-test.yml
    with:
      runner: ${{ vars.HCU_TEST_RUNNER }}
      ci-image: ${{ vars.HCU_CI_IMAGE }}
      expected-device-count: ${{ vars.HCU_EXPECTED_DEVICE_COUNT }}
      artifact-path: ${{ needs.hcu-build.outputs.artifact-path || needs.hcu-reuse-artifact.outputs.artifact-path }}
      build-runner-name: ${{ needs.hcu-build.outputs.runner-name || needs.hcu-reuse-artifact.outputs.runner-name }}
      build-environment: ${{ needs.hcu-build.outputs.build-environment || needs.hcu-reuse-artifact.outputs.build-environment }}
      build-image-digest: ${{ needs.hcu-build.outputs.image-digest || needs.hcu-reuse-artifact.outputs.image-digest }}
      source-sha: ${{ needs.hcu-reuse-artifact.outputs.source-sha || github.sha }}
      tests-to-include: ${{ github.event.inputs.tests-to-include || '' }}
      timeout-minutes: 720
      test-matrix: |
        {"include":[
          {"config":"default","shard":1,"num_shards":8}
        ]}

  hcu-stage4-required:
    if: >-
      ${{
        always() &&
        github.repository == 'HYGON-AI/pytorch-das' &&
        vars.HCU_CI_ENABLED == 'true'
      }}
    name: hcu-stage4-required
    needs: [hcu-preflight, hcu-build, hcu-reuse-artifact, hcu-test]
    runs-on: [self-hosted, linux, x64, "${{ vars.HCU_CONTROL_RUNNER }}"]
    steps:
      - name: Report stable HCU Stage 4 result
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.hcu-preflight.result }}
          HCU_ALLOWED: ${{ needs.hcu-preflight.outputs.allowed }}
          HCU_BUILD_RESULT: ${{ needs.hcu-build.result }}
          HCU_REUSE_RESULT: ${{ needs.hcu-reuse-artifact.result }}
          HCU_TEST_RESULT: ${{ needs.hcu-test.result }}
        run: |
          set -euo pipefail
          if [[ "${PREFLIGHT_RESULT}" != "success" || "${HCU_ALLOWED}" != "true" ]]; then
            echo "HCU Stage 4 preflight failed: result=${PREFLIGHT_RESULT}, allowed=${HCU_ALLOWED}" >&2
            exit 1
          fi
          producer_count=0
          [[ "${HCU_BUILD_RESULT}" == "success" ]] && producer_count=$((producer_count + 1))
          [[ "${HCU_REUSE_RESULT}" == "success" ]] && producer_count=$((producer_count + 1))
          if (( producer_count != 1 )); then
            echo "Exactly one wheel source must succeed: build=${HCU_BUILD_RESULT}, reuse=${HCU_REUSE_RESULT}" >&2
            exit 1
          fi
          if [[ "${HCU_TEST_RESULT}" != "success" ]]; then
            echo "HCU Stage 4 default 1/8 failed: ${HCU_TEST_RESULT}" >&2
            exit 1
          fi
          if [[ "${HCU_BUILD_RESULT}" == "success" ]]; then
            echo "HCU Stage 4 fresh wheel build and default 1/8 passed."
          else
            echo "HCU Stage 4 verified wheel reuse and default 1/8 passed."
          fi
