name: hcu-test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Self-hosted runner label configured in vars.HCU_TEST_RUNNER.
      ci-image:
        required: true
        type: string
        description: Immutable HCU CI image reference configured in vars.HCU_CI_IMAGE.
      expected-device-count:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      build-environment:
        required: true
        type: string
      test-matrix:
        required: true
        type: string
      tests-to-include:
        required: false
        default: ""
        type: string
      timeout-minutes:
        required: false
        default: 300
        type: number

permissions:
  contents: read
  actions: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test-matrix) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Validate HCU runner
        uses: ./.github/actions/setup-hcu
        with:
          expected-device-count: ${{ inputs.expected-device-count }}
          run-label: hcu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.config }}-${{ matrix.shard }}

      - name: Pull immutable HCU CI image
        id: image
        shell: bash
        env:
          CI_IMAGE: ${{ inputs.ci-image }}
        run: |
          set -euo pipefail
          docker pull "${CI_IMAGE}"
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${CI_IMAGE}" || true)"
          if [[ -z "${image_digest}" || "${image_digest}" == "<no value>" ]]; then
            image_digest="$(docker image inspect --format '{{.Id}}' "${CI_IMAGE}")"
          fi
          echo "image-digest=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Download HCU build artifact
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: hcu-artifact

      - name: Extract and verify HCU build artifact
        shell: bash
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image-digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          unzip -o hcu-artifact/artifacts.zip
          python3 .github/scripts/hcu_ci_manifest.py validate \
            --manifest hcu-build-manifest.json \
            --dist-dir dist \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --build-environment "${BUILD_ENVIRONMENT}" \
            --image-digest "${IMAGE_DIGEST}"

      - name: Run HCU test matrix entry
        id: test
        shell: bash
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
          CI_IMAGE: ${{ inputs.ci-image }}
          TEST_CONFIG: ${{ matrix.config }}
          SHARD_NUMBER: ${{ matrix.shard }}
          NUM_TEST_SHARDS: ${{ matrix.num_shards }}
          TESTS_TO_INCLUDE: ${{ inputs.tests-to-include }}
        run: |
          set -euo pipefail
          run_label="hcu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TEST_CONFIG}-${SHARD_NUMBER}"
          container_name="pytorch-hcu-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TEST_CONFIG}-${SHARD_NUMBER}"
          env_file="${RUNNER_TEMP}/${run_label}.env"
          env | grep -E '^(GITHUB|CI)_' > "${env_file}" || true

          # shellcheck disable=SC2086
          docker run --detach \
            --name "${container_name}" \
            --label "org.pytorch.hcu.run=${run_label}" \
            ${HCU_DOCKER_GPU_ARGS} \
            --env-file "${env_file}" \
            --env BUILD_ENVIRONMENT \
            --env TEST_CONFIG \
            --env SHARD_NUMBER \
            --env NUM_TEST_SHARDS \
            --env TESTS_TO_INCLUDE \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            --volume "${GITHUB_WORKSPACE}:/var/lib/jenkins/workspace" \
            --workdir /var/lib/jenkins/workspace \
            "${CI_IMAGE}" \
            sleep infinity

          echo "HCU_TEST_CONTAINER=${container_name}" >> "${GITHUB_ENV}"
          echo "HCU_TEST_LABEL=org.pytorch.hcu.run=${run_label}" >> "${GITHUB_ENV}"
          docker exec --tty "${container_name}" bash -lc 'python3 -m pip install $(echo dist/*.whl)[opt-einsum]'
          if [[ "${TEST_CONFIG}" == "smoke" ]]; then
            docker exec --tty "${container_name}" python3 -c 'import torch; assert torch.cuda.is_available(), "HCU device is not visible through torch.cuda"; assert torch.version.hip, "PyTorch was not built with HIP support"; print(torch.__version__); print(torch.version.hip); print(torch.cuda.get_device_name(0))'
          else
            docker exec --tty "${container_name}" bash -lc '.ci/pytorch/test.sh'
          fi

      - name: Collect HCU test container log
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HCU_TEST_CONTAINER:-}" ]]; then
            docker logs "${HCU_TEST_CONTAINER}" > hcu-test-container.log 2>&1 || true
          fi

      - name: Upload HCU test log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hcu-test-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.config }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: ignore
          path: hcu-test-container.log

      - name: Remove containers scoped to this test run
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HCU_TEST_LABEL:-}" ]]; then
            exit 0
          fi
          mapfile -t containers < <(docker ps -aq --filter "label=${HCU_TEST_LABEL}")
          if (( ${#containers[@]} > 0 )); then
            docker rm -f "${containers[@]}"
          fi
