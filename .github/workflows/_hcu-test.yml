name: hcu-test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Self-hosted runner label configured in vars.HCU_TEST_RUNNER.
      ci-image:
        required: true
        type: string
        description: Immutable HCU CI image reference configured in vars.HCU_CI_IMAGE.
      expected-device-count:
        required: true
        type: string
      artifact-path:
        required: true
        type: string
        description: Absolute runner-local path produced by the HCU build job.
      build-runner-name:
        required: true
        type: string
        description: Exact self-hosted runner that produced the local artifact.
      build-environment:
        required: true
        type: string
      build-image-digest:
        required: true
        type: string
        description: Immutable build image digest recorded by the HCU build job.
      source-sha:
        required: false
        default: ""
        type: string
        description: Source SHA recorded in the wheel manifest; defaults to this run SHA.
      test-matrix:
        required: true
        type: string
      tests-to-include:
        required: false
        default: ""
        type: string
      timeout-minutes:
        required: false
        default: 360
        type: number

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test-matrix) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          submodules: false

      - name: Validate HCU runner
        uses: ./.github/actions/setup-hcu
        with:
          expected-device-count: ${{ inputs.expected-device-count }}
          run-label: hcu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.config }}-${{ matrix.shard }}

      - name: Resolve immutable HCU CI image
        id: image
        shell: bash
        env:
          CI_IMAGE: ${{ inputs.ci-image }}
        run: |
          set -euo pipefail
          if [[ "${CI_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            docker pull "${CI_IMAGE}"
          elif [[ "${CI_IMAGE}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            docker image inspect "${CI_IMAGE}" > /dev/null
          else
            echo "HCU CI image is not immutable: ${CI_IMAGE}" >&2
            exit 1
          fi

          image_id="$(docker image inspect --format '{{.Id}}' "${CI_IMAGE}")"
          if [[ "${CI_IMAGE}" == sha256:* && "${image_id}" != "${CI_IMAGE}" ]]; then
            echo "Runner-local HCU CI image ID mismatch" >&2
            exit 1
          fi
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${CI_IMAGE}" || true)"
          if [[ -z "${image_digest}" || "${image_digest}" == "<no value>" ]]; then
            image_digest="${image_id}"
          fi
          echo "image-digest=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Load HCU build artifact from runner storage
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          BUILD_RUNNER_NAME: ${{ inputs.build-runner-name }}
        run: |
          set -euo pipefail
          expected_root=/home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-artifacts
          artifact_path="$(realpath -m -- "${ARTIFACT_PATH}")"
          if [[ "${artifact_path}" != "${expected_root}/"* ]]; then
            echo "HCU artifact path is outside ${expected_root}: ${artifact_path}" >&2
            exit 1
          fi
          if [[ "${RUNNER_NAME}" != "${BUILD_RUNNER_NAME}" ]]; then
            echo "Runner-local artifact was built on ${BUILD_RUNNER_NAME}, but test was scheduled on ${RUNNER_NAME}" >&2
            exit 1
          fi
          test -f "${artifact_path}/READY"
          test ! -e "${artifact_path}/INCOMPLETE"
          (
            cd "${artifact_path}"
            sha256sum --check artifacts.zip.sha256
          )

      - name: Extract and verify HCU build artifact
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
          BUILD_IMAGE_DIGEST: ${{ inputs.build-image-digest }}
          SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
        run: |
          set -euo pipefail
          unzip -o "${ARTIFACT_PATH}/artifacts.zip"
          python3 .github/scripts/hcu_ci_manifest.py validate \
            --manifest hcu-build-manifest.json \
            --dist-dir dist \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --build-environment "${BUILD_ENVIRONMENT}" \
            --image-digest "${BUILD_IMAGE_DIGEST}"

      - name: Run HCU test matrix entry
        id: test
        shell: bash
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
          CI_IMAGE: ${{ inputs.ci-image }}
          HCU_EXPECTED_DEVICE_COUNT: ${{ inputs.expected-device-count }}
          TEST_CONFIG: ${{ matrix.config }}
          SHARD_NUMBER: ${{ matrix.shard }}
          NUM_TEST_SHARDS: ${{ matrix.num_shards }}
          TESTS_TO_INCLUDE: ${{ inputs.tests-to-include }}
          CONTINUE_THROUGH_ERROR: ${{ matrix.config == 'default' && '1' || '0' }}
          TORCHINDUCTOR_COMPILE_THREADS: "1"
          TRITON_DEFAULT_BACKEND: hcu
        run: |
          set -euo pipefail
          run_label="hcu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TEST_CONFIG}-${SHARD_NUMBER}"
          container_name="pytorch-hcu-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TEST_CONFIG}-${SHARD_NUMBER}"
          env_file="${RUNNER_TEMP}/${run_label}.env"
          env | grep -E '^(GITHUB|CI)_' > "${env_file}" || true

          # shellcheck disable=SC2086
          docker run --detach \
            --name "${container_name}" \
            --label "org.pytorch.hcu.run=${run_label}" \
            ${HCU_DOCKER_GPU_ARGS} \
            --env-file "${env_file}" \
            --env BUILD_ENVIRONMENT \
            --env HCU_EXPECTED_DEVICE_COUNT \
            --env TEST_CONFIG \
            --env SHARD_NUMBER \
            --env NUM_TEST_SHARDS \
            --env TESTS_TO_INCLUDE \
            --env CONTINUE_THROUGH_ERROR \
            --env TORCHINDUCTOR_COMPILE_THREADS \
            --env TRITON_DEFAULT_BACKEND \
            --shm-size=8g \
            --ulimit stack=67108864 \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            --volume "${GITHUB_WORKSPACE}:/var/lib/jenkins/workspace" \
            --workdir /var/lib/jenkins/workspace \
            "${CI_IMAGE}" \
            sleep infinity

          echo "HCU_TEST_CONTAINER=${container_name}" >> "${GITHUB_ENV}"
          echo "HCU_TEST_LABEL=org.pytorch.hcu.run=${run_label}" >> "${GITHUB_ENV}"
          docker exec "${container_name}" bash -lc \
            'set -euo pipefail
             source_root=/var/lib/jenkins/workspace
             mapfile -t wheels < <(compgen -G "${source_root}/dist/*.whl")
             (( ${#wheels[@]} == 1 ))
             install_dir="/tmp/pytorch-hcu-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
             mkdir -p "${install_dir}"
             cd "${install_dir}"
             unset PYTHONPATH
             if [[ "${TEST_CONFIG}" != "smoke" ]]; then
               python3 -m pip uninstall -y pytest-asyncio
               python3 -m pip install -r "${source_root}/.ci/docker/requirements-ci.txt"
             fi
             python3 -m pip install expecttest==0.3.0 opt-einsum==3.4.0
             python3 -m pip install --force-reinstall --no-deps "${wheels[0]}"' \
            2>&1 | tee hcu-test.log
          docker exec "${container_name}" bash -lc \
            'set -euo pipefail
             install_dir="/tmp/pytorch-hcu-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
             cd "${install_dir}"
             unset PYTHONPATH
             python3 --version
             python3 -m pip --version
             python3 -m pip freeze
             python3 -c "import os; import torch; torch_file=os.path.realpath(torch.__file__); source_root=os.path.realpath(\"/var/lib/jenkins/workspace/torch\"); assert not torch_file.startswith(source_root + os.sep), f\"torch loaded from source checkout: {torch_file}\"; print(f\"torch={torch.__version__}\"); print(f\"torch_file={torch_file}\"); print(f\"hip={torch.version.hip}\"); print(f\"hcu_count={torch.cuda.device_count()}\")"' \
            > hcu-test-environment.txt 2>&1
          if [[ "${TEST_CONFIG}" == "smoke" ]]; then
            docker exec \
              --env HCU_EXPECTED_DEVICE_COUNT \
              --env HCU_SOURCE_ROOT=/var/lib/jenkins/workspace \
              "${container_name}" \
              bash -lc '
                set -euo pipefail
                smoke_dir="/tmp/pytorch-hcu-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                mkdir -p "${smoke_dir}"
                cd "${smoke_dir}"
                unset PYTHONPATH
                python3 /var/lib/jenkins/workspace/.github/scripts/hcu_smoke_test.py
              ' 2>&1 | tee -a hcu-test.log
          else
            docker exec "${container_name}" bash -lc \
              'set -euo pipefail
               cd /var/lib/jenkins/workspace
               unset PYTHONPATH
               .ci/pytorch/test.sh' \
              2>&1 | tee -a hcu-test.log
          fi

      - name: Collect HCU test container log
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HCU_TEST_CONTAINER:-}" ]]; then
            docker logs "${HCU_TEST_CONTAINER}" > hcu-test-container.log 2>&1 || true
          fi

      - name: Persist HCU test logs on runner
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          JOB_STATUS: ${{ job.status }}
          TEST_CONFIG: ${{ matrix.config }}
          SHARD_NUMBER: ${{ matrix.shard }}
          NUM_TEST_SHARDS: ${{ matrix.num_shards }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_PATH}" || ! -d "${ARTIFACT_PATH}" ]]; then
            exit 0
          fi
          expected_root=/home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-artifacts
          artifact_path="$(realpath -m -- "${ARTIFACT_PATH}")"
          if [[ "${artifact_path}" != "${expected_root}/"* ]]; then
            echo "Refusing to persist logs outside ${expected_root}" >&2
            exit 1
          fi
          log_dir="${artifact_path}/tests/${TEST_CONFIG}-${SHARD_NUMBER}-of-${NUM_TEST_SHARDS}"
          install -d -m 0750 "${log_dir}"
          if [[ -f hcu-test.log ]]; then
            gzip -c hcu-test.log > "${log_dir}/hcu-test.log.gz"
          fi
          if [[ -f hcu-test-container.log ]]; then
            gzip -c hcu-test-container.log > "${log_dir}/hcu-test-container.log.gz"
          fi
          if [[ -f hcu-test-environment.txt ]]; then
            gzip -c hcu-test-environment.txt > "${log_dir}/hcu-test-environment.txt.gz"
          fi
          if [[ -d test/test-reports ]]; then
            tar -C test -czf "${log_dir}/test-reports.tar.gz" test-reports
          fi
          printf "%s\n" "${JOB_STATUS}" > "${log_dir}/test-job-status.txt"
          chmod 0640 "${log_dir}"/*

      - name: Remove containers scoped to this test run
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HCU_TEST_LABEL:-}" ]]; then
            exit 0
          fi
          mapfile -t containers < <(docker ps -aq --filter "label=${HCU_TEST_LABEL}")
          if (( ${#containers[@]} > 0 )); then
            docker rm -f "${containers[@]}"
          fi
