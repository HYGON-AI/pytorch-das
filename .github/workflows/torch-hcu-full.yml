name: torch-hcu-full
run-name: "torch-hcu-full - ${{ github.event_name }} - ${{ github.ref_name || 'scheduled' }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: build and full test
    uses: ./.github/workflows/github-ci.yml
    with:
      suite: full
      source_ref: 2.13.0-dev
      merge_pr: false
      publish: false
