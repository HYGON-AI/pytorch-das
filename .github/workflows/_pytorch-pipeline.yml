name: PyTorch 2.12 pipeline

on:
  workflow_call:
    inputs:
      suite:
        description: "Test mode passed to hcu-torch-ci: pr or full."
        required: true
        type: string
      source_ref:
        required: true
        type: string
      merge_pr:
        required: false
        default: false
        type: boolean
      pr_base_sha:
        required: false
        default: ""
        type: string
      pr_head_sha:
        required: false
        default: ""
        type: string
      publish:
        required: false
        default: false
        type: boolean
    secrets:
      PYPI_PASSWORD:
        required: false

permissions:
  contents: read

# Both Python variants are built sequentially on the single eight-card host.
# The Python 3.10 container is retained for tests, so no GitHub artifacts are needed.
concurrency:
  group: pytorch-2.12-bw1100
  cancel-in-progress: false

env:
  DTK_PKG_URL: "http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz"
  DTK_PKG_NAME: "DTK-26.04-rc4-centos8-x86_64.tar.gz"
  MAGMA_URL: "http://42.228.13.241:18000/thirdparty/pytorch/magma-install.tar.gz"
  MAGMA_SHA256: "facbada3e2e8d366a1931627521e16484328abbec91c997500506dc51d59d2d8"
  BUILD_IMAGE_PY310: "42.228.13.241:5000/dev/dev:rockylinux8.6-mpi5.0-gcc13.3-cmake3.29-py3.10-mkl2024.2.0.664"
  BUILD_IMAGE_PY312: "42.228.13.241:5000/dev/dev:rockylinux8.6-mpi5.0-gcc13.3-cmake3.29-py3.12-mkl2024.2.0.664"
  BUILD_PIP_INDEX_URL: "http://10.16.1.201:9929/nightly/dtk2604/+simple/"
  BUILD_PIP_TRUSTED_HOST: "10.16.1.201"
  HCU_CI_INDEX_URL: "http://10.16.1.201:9929/open/deps/+simple/"
  AMDGPU_TARGETS: "gfx906;gfx926;gfx928;gfx936;gfx938"
  CONTAINER_NAME_PY310: "pytorch-2.12-py310-${{ github.run_id }}-${{ github.run_attempt }}"
  CONTAINER_NAME_PY312: "pytorch-2.12-py312-${{ github.run_id }}-${{ github.run_attempt }}"
  LOCAL_RUN_ROOT: "/home/github/actions-runner-torch/pytorch-ci/${{ github.run_id }}/${{ github.run_attempt }}"

jobs:
  pipeline:
    name: build / test / publish
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, bw1100]
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    steps:
      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          ref: ${{ inputs.merge_pr && inputs.pr_base_sha || inputs.source_ref }}

      - name: Merge PR into target branch locally
        if: inputs.merge_pr
        shell: bash
        env:
          PR_BASE_SHA: ${{ inputs.pr_base_sha }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          test -n "${PR_BASE_SHA}"
          test -n "${PR_HEAD_SHA}"
          git fetch --no-tags origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          git checkout --detach "${PR_BASE_SHA}"
          git -c user.name=github-actions -c user.email=ci@github \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"

      - name: Set build context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.suite }}" in
            pr|full) ;;
            *) echo "ERROR: unsupported suite: ${{ inputs.suite }}" >&2; exit 1 ;;
          esac
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          rm -rf -- "${LOCAL_RUN_ROOT}"
          mkdir -p \
            "${LOCAL_RUN_ROOT}/logs" \
            "${LOCAL_RUN_ROOT}/reports" \
            "${LOCAL_RUN_ROOT}/dist/py310" \
            "${LOCAL_RUN_ROOT}/dist/py312"
          echo "source_sha=${source_sha}"
          echo "local_output=${LOCAL_RUN_ROOT}"

      - name: Build Python 3.10 and 3.12 wheels
        id: build
        shell: bash
        env:
          SOURCE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: bash scripts/ci_hcu_pipeline.sh build

      - name: Run hcu-torch-ci
        id: tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: bash scripts/ci_hcu_pipeline.sh test "${{ inputs.suite }}"

      - name: Upload wheels after merged-branch tests pass
        if: ${{ inputs.publish && steps.build.outcome == 'success' && steps.tests.outcome == 'success' }}
        shell: bash
        env:
          DEVPI_URL: "http://10.16.1.201:9929"
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: bash scripts/ci_hcu_pipeline.sh publish

      - name: Save test reports locally
        if: always()
        shell: bash
        run: bash scripts/ci_hcu_pipeline.sh collect

      - name: Cleanup container
        if: always()
        shell: bash
        run: bash scripts/ci_hcu_pipeline.sh cleanup
