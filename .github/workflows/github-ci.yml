name: PyTorch CI
run-name: "PyTorch - ${{ github.event_name }} - ${{ github.event.pull_request.number || github.ref_name || 'nightly' }}"

on:
  pull_request:
    branches:
      - 2.12.0-dev
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 2.12.0-dev
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC: Beijing 00:00 every Monday and Thursday.
    # The reusable workflow skips the full test when the branch has had no
    # commits during the previous seven days.
    - cron: "0 16 * * 0,3"

permissions:
  contents: read

concurrency:
  group: pytorch-${{ github.event.pull_request.number || github.ref_name || github.event_name }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: build, test and optional publish
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    uses: ./.github/workflows/_pytorch-pipeline.yml
    with:
      suite: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}
      source_ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2.12.0-dev' || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
      # DTK 26.10 is temporarily disabled; run the pipeline with DTK 26.04 only.
      dtk_variants: >-
        [
          {
            "id": "dtk2604",
            "directory": "dtk26.04",
            "package": "DTK-26.04-rc4-centos8-x86_64.tar.gz"
          }
        ]
      merge_pr: ${{ github.event_name == 'pull_request' }}
      pr_base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      pr_head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      publish: ${{ github.event_name == 'push' && github.ref_name == '2.12.0-dev' }}
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
