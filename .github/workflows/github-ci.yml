name: PyTorch 2.12 CI
run-name: "PyTorch 2.12 - ${{ github.event_name }} - ${{ github.event.pull_request.number || github.ref_name || 'nightly' }}"

on:
  pull_request:
    branches:
      - 2.12.0-dev
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 2.12.0-dev
      # TEMPORARY: remove before merging the CI changes into 2.12.0-dev.
      - ljz/pytorch-2.12-ci
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC: Beijing 02:00 every Monday, Wednesday and Friday.
    - cron: "0 18 * * 0,2,4"

permissions:
  contents: read

concurrency:
  group: pytorch-2.12-${{ github.event.pull_request.number || github.ref_name || github.event_name }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: build, test and optional publish
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/_pytorch-pipeline.yml
    with:
      suite: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}
      source_ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2.12.0-dev' || github.sha }}
      merge_pr: ${{ github.event_name == 'pull_request' }}
      pr_base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      pr_head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      publish: ${{ github.event_name == 'push' && github.ref_name == '2.12.0-dev' }}
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
