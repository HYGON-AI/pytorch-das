name: PyTorch 2.12 CI
run-name: "PyTorch 2.12 - ${{ github.event_name }} - ${{ github.event.pull_request.number || github.ref_name || 'nightly' }}"

on:
  pull_request_target:
    branches:
      - 2.12.0-dev
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 2.12.0-dev
      # TEMPORARY: remove before merging the CI changes into 2.12.0-dev.
      - ljz/pytorch-2.12-ci
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC: Beijing 02:00 every Monday.
    # The reusable workflow skips the full test when the branch has had no
    # commits during the previous seven days.
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: pytorch-2.12-${{ github.event.pull_request.number || github.ref_name || github.event_name }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: build, test and optional publish
    if: >-
      ${{
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository ||
        github.event.pull_request.head.repo.full_name == 'lijiazhen-netizen/pytorch-das'
      }}
    uses: ./.github/workflows/_pytorch-pipeline.yml
    with:
      suite: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}
      source_ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2.12.0-dev' || (github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha) }}
      # Add the other DTK versions here. Each id must be unique.
      dtk_variants: >-
        [
          {
            "id": "dtk2604",
            "directory": "dtk26.04",
            "package": "DTK-26.04-rc4-centos8-x86_64.tar.gz"
          },
          {
            "id": "dtk2704",
            "directory": "dtk27.04",
            "package": "DTK-27.04-shaobo-bu-0911-centos8-x86_64.tar.gz"
          },
          {
            "id": "dtk2610",
            "directory": "dtk26.10",
            "package": "DTK-26.10-CentOS8.5-x86_64.tar.gz"
          }

        ]
      merge_pr: ${{ github.event_name == 'pull_request_target' }}
      pr_base_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || '' }}
      pr_head_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      publish: ${{ github.event_name == 'push' && github.ref_name == '2.12.0-dev' }}
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
