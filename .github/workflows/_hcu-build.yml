name: hcu-build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Self-hosted runner label configured in vars.HCU_BUILD_RUNNER.
      ci-image:
        required: true
        type: string
        description: Immutable HCU CI image reference configured in vars.HCU_CI_IMAGE.
      artifact-name:
        required: true
        type: string
        description: Workflow-scoped artifact name stored on the HCU runner.
      artifact-root:
        required: false
        default: /home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-artifacts
        type: string
        description: Persistent runner-local root used for HCU artifacts and logs.
      build-environment:
        required: false
        default: linux-jammy-rocm-hcu-py3.10
        type: string
      rocm-arch:
        required: false
        default: gfx938
        type: string
        description: HCU GPU architecture compiled into the fresh wheel.
      max-jobs:
        required: false
        default: 32
        type: number
        description: Maximum number of parallel compilation jobs.
      timeout-minutes:
        required: false
        default: 480
        type: number
    outputs:
      artifact-name:
        description: Name of the verified build artifact.
        value: ${{ jobs.build.outputs.artifact-name }}
      artifact-path:
        description: Absolute runner-local path containing the verified build artifact.
        value: ${{ jobs.build.outputs.artifact-path }}
      build-environment:
        description: Build environment used for the artifact.
        value: ${{ jobs.build.outputs.build-environment }}
      runner-name:
        description: Exact self-hosted runner that produced the local artifact.
        value: ${{ jobs.build.outputs.runner-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      CI: "1"
      HCU_REUSE_OLD_WHL: "0"
      HCU_SETUPTOOLS_VERSION: "79.0.1"
      MAX_JOBS: ${{ inputs.max-jobs }}
      PYTORCH_ROCM_ARCH: ${{ inputs.rocm-arch }}
      USE_KINETO: "0"
      USE_FLASH_ATTENTION: "0"
      USE_MEM_EFF_ATTENTION: "0"
      USE_ROCM_CK_GEMM: "0"
    outputs:
      artifact-name: ${{ steps.outputs.outputs.artifact-name }}
      artifact-path: ${{ steps.storage.outputs.artifact-path }}
      build-environment: ${{ steps.outputs.outputs.build-environment }}
      runner-name: ${{ steps.storage.outputs.runner-name }}
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Prepare runner-local HCU artifact storage
        id: storage
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          ARTIFACT_ROOT: ${{ inputs.artifact-root }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_root=/home/github/lyt/HYGON-AI_repositories/pytorch-das-ci-artifacts
          artifact_root="$(realpath -m -- "${ARTIFACT_ROOT}")"
          if [[ "${artifact_root}" != "${expected_root}" ]]; then
            echo "HCU artifact root must be ${expected_root}" >&2
            exit 1
          fi
          if [[ -z "${ARTIFACT_NAME}" || ! "${ARTIFACT_NAME}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid HCU artifact name: ${ARTIFACT_NAME}" >&2
            exit 1
          fi

          artifact_path="${artifact_root}/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${ARTIFACT_NAME}"
          artifact_path="$(realpath -m -- "${artifact_path}")"
          if [[ "${artifact_path}" != "${artifact_root}/"* ]]; then
            echo "HCU artifact path escaped the configured root" >&2
            exit 1
          fi
          if [[ -e "${artifact_path}" ]]; then
            echo "HCU artifact path already exists: ${artifact_path}" >&2
            exit 1
          fi

          install -d -m 0750 "${artifact_path}"
          {
            printf "repository=%s\n" "${GITHUB_REPOSITORY}"
            printf "source_sha=%s\n" "${SOURCE_SHA}"
            printf "run_id=%s\n" "${GITHUB_RUN_ID}"
            printf "run_attempt=%s\n" "${GITHUB_RUN_ATTEMPT}"
            printf "runner_name=%s\n" "${RUNNER_NAME}"
            printf "artifact_name=%s\n" "${ARTIFACT_NAME}"
          } > "${artifact_path}/run-metadata.txt"
          touch "${artifact_path}/INCOMPLETE"
          echo "artifact-path=${artifact_path}" >> "${GITHUB_OUTPUT}"
          echo "runner-name=${RUNNER_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Check HCU build host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          test -x /opt/hyhal/bin/hy-smi

      - name: Pull immutable HCU CI image
        id: image
        shell: bash
        env:
          CI_IMAGE: ${{ inputs.ci-image }}
        run: |
          set -euo pipefail
          docker pull "${CI_IMAGE}"
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${CI_IMAGE}" || true)"
          if [[ -z "${image_digest}" || "${image_digest}" == "<no value>" ]]; then
            image_digest="$(docker image inspect --format '{{.Id}}' "${CI_IMAGE}")"
          fi
          echo "image-digest=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Build fresh HCU wheel
        id: build
        shell: bash
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
          CI_IMAGE: ${{ inputs.ci-image }}
          SOURCE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          run_label="hcu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-build"
          container_name="pytorch-hcu-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="${RUNNER_TEMP}/${run_label}"
          env_file="${run_dir}/github.env"
          mkdir -p "${run_dir}"
          env | grep -E '^(GITHUB|CI)_' > "${env_file}" || true

          docker run --detach \
            --name "${container_name}" \
            --label "org.pytorch.hcu.run=${run_label}" \
            --env-file "${env_file}" \
            --env BUILD_ENVIRONMENT \
            --env CI \
            --env HCU_REUSE_OLD_WHL \
            --env HCU_SETUPTOOLS_VERSION \
            --env MAX_JOBS \
            --env PYTORCH_ROCM_ARCH \
            --env SOURCE_SHA \
            --env BASE_SHA \
            --env USE_FLASH_ATTENTION \
            --env USE_KINETO \
            --env USE_MEM_EFF_ATTENTION \
            --env USE_ROCM_CK_GEMM \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            --volume /opt/hyhal:/opt/hyhal:ro \
            --volume "${GITHUB_WORKSPACE}:/var/lib/jenkins/workspace" \
            --workdir /var/lib/jenkins/workspace \
            "${CI_IMAGE}" \
            sleep infinity

          echo "HCU_BUILD_CONTAINER=${container_name}" >> "${GITHUB_ENV}"
          echo "HCU_BUILD_LABEL=org.pytorch.hcu.run=${run_label}" >> "${GITHUB_ENV}"
          docker exec "${container_name}" bash -lc '
            test -x /opt/dtk/bin/hipcc
            if [[ ! -e /usr/lib/x86_64-linux-gnu/librt.so ]]; then
              test -e /usr/lib/x86_64-linux-gnu/librt.so.1
              ln -s librt.so.1 /usr/lib/x86_64-linux-gnu/librt.so
            fi
            python3 -m pip install --disable-pip-version-check --no-deps \
              "setuptools==${HCU_SETUPTOOLS_VERSION}"
            git config --global --add safe.directory /var/lib/jenkins/workspace
            .ci/pytorch/build.sh
          ' \
            2>&1 | tee hcu-build.log
          docker exec "${container_name}" bash -lc '
            set -euo pipefail
            hipcc_bin="$(command -v hipcc || true)"
            if [[ -z "${hipcc_bin}" && -x /opt/dtk/bin/hipcc ]]; then
              hipcc_bin=/opt/dtk/bin/hipcc
            fi
            test -n "${hipcc_bin}"
            {
              printf "python=%s\\n" "$(python3 --version)"
              printf "cmake=%s\\n" "$(cmake --version | head -n 1)"
              printf "compiler=%s\\n" "$(c++ --version | head -n 1)"
              printf "dtk=%s\\n" "$("${hipcc_bin}" --version | head -n 1)"
            } > .hcu-tool-versions.env
          ' 2>&1 | tee -a hcu-build.log

      - name: Create HCU build manifest and artifact
        shell: bash
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
          CI_IMAGE: ${{ inputs.ci-image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image-digest }}
          SOURCE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" ]]; then
            BASE_SHA="$(git rev-parse "${SOURCE_SHA}^")"
          fi
          tool_arguments=()
          while IFS= read -r version; do
            tool_arguments+=(--tool-version "${version}")
          done < .hcu-tool-versions.env

          python3 .github/scripts/hcu_ci_manifest.py write \
            --output hcu-build-manifest.json \
            --dist-dir dist \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --base-sha "${BASE_SHA}" \
            --build-environment "${BUILD_ENVIRONMENT}" \
            --image-reference "${CI_IMAGE}" \
            --image-digest "${IMAGE_DIGEST}" \
            "${tool_arguments[@]}"
          zip -1 -r artifacts.zip \
            dist/ \
            build/custom_test_artifacts \
            build/lib \
            build/bin \
            .additional_ci_files \
            hcu-build-manifest.json

      - name: Publish HCU build artifact to runner storage
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.storage.outputs.artifact-path }}
        run: |
          set -euo pipefail
          test -d "${ARTIFACT_PATH}"
          test -f "${ARTIFACT_PATH}/INCOMPLETE"
          sha256sum artifacts.zip > artifacts.zip.sha256
          cp --reflink=auto -- artifacts.zip "${ARTIFACT_PATH}/artifacts.zip"
          cp -- artifacts.zip.sha256 "${ARTIFACT_PATH}/artifacts.zip.sha256"
          cp -- hcu-build-manifest.json "${ARTIFACT_PATH}/hcu-build-manifest.json"
          chmod 0640 \
            "${ARTIFACT_PATH}/artifacts.zip" \
            "${ARTIFACT_PATH}/artifacts.zip.sha256" \
            "${ARTIFACT_PATH}/hcu-build-manifest.json"
          (
            cd "${ARTIFACT_PATH}"
            sha256sum --check artifacts.zip.sha256
          )
          touch "${ARTIFACT_PATH}/READY"
          rm -- "${ARTIFACT_PATH}/INCOMPLETE"

      - name: Set reusable workflow outputs
        id: outputs
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
        run: |
          echo "artifact-name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "build-environment=${BUILD_ENVIRONMENT}" >> "${GITHUB_OUTPUT}"

      - name: Collect build container log
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HCU_BUILD_CONTAINER:-}" ]]; then
            docker logs "${HCU_BUILD_CONTAINER}" > hcu-build-container.log 2>&1 || true
          fi

      - name: Persist HCU build logs on runner
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.storage.outputs.artifact-path }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_PATH}" || ! -d "${ARTIFACT_PATH}" ]]; then
            exit 0
          fi
          log_dir="${ARTIFACT_PATH}/logs"
          install -d -m 0750 "${log_dir}"
          if [[ -f hcu-build.log ]]; then
            gzip -c hcu-build.log > "${log_dir}/hcu-build.log.gz"
          fi
          if [[ -f hcu-build-container.log ]]; then
            gzip -c hcu-build-container.log > "${log_dir}/hcu-build-container.log.gz"
          fi
          printf "%s\n" "${JOB_STATUS}" > "${log_dir}/build-job-status.txt"
          chmod 0640 "${log_dir}"/*

      - name: Remove containers scoped to this build run
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HCU_BUILD_LABEL:-}" ]]; then
            exit 0
          fi
          mapfile -t containers < <(docker ps -aq --filter "label=${HCU_BUILD_LABEL}")
          if (( ${#containers[@]} > 0 )); then
            docker rm -f "${containers[@]}"
          fi
