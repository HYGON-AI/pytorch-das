name: torch-2.12-hcu-pr
run-name: "torch-2.12-hcu-pr - ${{ github.event_name }} - ${{ github.event.pull_request.number || github.ref_name }}"

on:
  pull_request_target:
    branches: [2.12.0-dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [2.12.0-dev]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name || github.event_name }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request_target' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready-hcu')
    }}

jobs:
  authorize-pr:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/_authorize-hcu-pr.yml

  pipeline:
    name: PyTorch 2.12 build, test and optional publish
    needs: authorize-pr
    if: >-
      ${{
        always() &&
        (github.event_name == 'push' ||
         (needs.authorize-pr.result == 'success' &&
          needs.authorize-pr.outputs.authorized == 'true'))
      }}
    uses: ./.github/workflows/_pytorch-pipeline.yml
    with:
      suite: pr
      source_ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      dtk_variants: >-
        [
          {
            "id": "dtk2604",
            "directory": "dtk26.04",
            "package": "DTK-26.04-rc4-centos8-x86_64.tar.gz"
          }
        ]
      merge_pr: ${{ github.event_name == 'pull_request_target' }}
      pr_base_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || '' }}
      pr_head_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      publish: ${{ github.event_name == 'push' }}
    secrets:
      PYPI_PASSWORD: ${{ github.event_name == 'push' && secrets.PYPI_PASSWORD || '' }}
