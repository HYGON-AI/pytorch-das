name: authorize-hcu-pr

on:
  workflow_call:
    outputs:
      authorized:
        value: ${{ jobs.authorize.outputs.authorized }}

permissions:
  contents: read
  issues: write

jobs:
  authorize:
    name: authorize HCU execution
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - name: Verify ready-hcu authorization
        id: authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const label = "ready-hcu";
            const action = context.payload.action;
            const pullRequest = context.payload.pull_request;
            const labels = pullRequest.labels.map(item => item.name);
            const resetActions = new Set([
              "opened",
              "reopened",
              "ready_for_review",
            ]);

            core.setOutput("authorized", "false");

            if (resetActions.has(action)) {
              if (labels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pullRequest.number,
                    name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }
              }
              core.setFailed(
                `HCU CI is locked for ${pullRequest.head.sha}. ` +
                `A trusted maintainer must apply the ${label} label.`
              );
              return;
            }

            if (action === "synchronize") {
              if (!labels.includes(label)) {
                core.setFailed(
                  `HCU CI is locked for ${pullRequest.head.sha}. ` +
                  `A trusted maintainer must apply the ${label} label.`
                );
                return;
              }
              core.info(
                `HCU CI remains authorized for ${pullRequest.head.sha}.`
              );
              core.setOutput("authorized", "true");
              return;
            }

            if (action === "labeled" && context.payload.label?.name !== label) {
              core.info(`Ignoring unrelated label: ${context.payload.label?.name}.`);
              return;
            }

            if (action !== "labeled") {
              core.setFailed(`Unsupported pull request action: ${action}.`);
              return;
            }

            const response = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const permission = response.data.permission;
            const trusted = new Set(["write", "maintain", "admin"]);
            if (!trusted.has(permission)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              core.setFailed(
                `${context.actor} cannot authorize HCU CI (permission: ${permission}).`
              );
              return;
            }

            core.info(
              `${context.actor} authorized HCU CI for ${pullRequest.head.sha}.`
            );
            core.setOutput("authorized", "true");
